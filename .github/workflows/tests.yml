# ✅ Auto-tests — every push to main runs all test suites (dev/tests/run_all.sh). Red = something broke.
name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          ls /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16)
          pip install -q playwright pdfplumber scikit-learn pyyaml
          python -m playwright install --with-deps chromium
      - name: Run all suites
        env:
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.json
        run: sudo -E env "PATH=$PATH" bash dev/tests/run_all.sh
      - name: Test report for the Control Room
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ runner.temp }}/test-summary.json
          if-no-files-found: ignore
          retention-days: 30
