name: RRB JE Extractor Tests

on:
  pull_request:
    paths:
      - "dev/tools/pyq-robot/rrb_je_extract.py"
      - "dev/tools/pyq-robot/test_rrb_je_extract.py"
      - ".github/workflows/rrb-je-extractor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text extraction dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Run parser unit tests
        working-directory: dev/tools/pyq-robot
        run: python -m unittest -v test_rrb_je_extract.py
      - name: Extract a real public RRB JE 2019 PDF (no import)
        run: |
          curl -fsSL --retry 3 "https://cdn.aglasem.com/aglasem-doc/dcb05986-aab6-11e9-9a6b-02f21f5619c4/dcb05986-aab6-11e9-9a6b-02f21f5619c4.pdf" -o "$RUNNER_TEMP/rrb-je-2019.pdf"
          python dev/tools/pyq-robot/rrb_je_extract.py "$RUNNER_TEMP/rrb-je-2019.pdf" "$RUNNER_TEMP/rrb-je-2019.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['question_count'] >= 80, d['question_count']; assert any(q.get('answer') for q in d['questions']), 'no explicit answer keys found'; q=next((x for x in d['questions'] if x['status']=='EXTRACTED'),d['questions'][0]); print('Real RRB JE PDF parsed:', d['question_count'], 'questions;', sum(bool(q.get('answer')) for q in d['questions']), 'explicit answers;', d['review_required_count'], 'need review'); print('Sample bilingual fields:',repr(q.get('question_hi','')[:100]),repr(q.get('question_en','')[:100]),q.get('options_hi',{}).get('A'),q.get('options_en',{}).get('A'))" "$RUNNER_TEMP/rrb-je-2019.json"
