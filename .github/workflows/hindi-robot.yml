# 🌐 Hindi Robot — adds Hindi (machine translation, IndicTrans2) to server questions that have none.
# Runs automatically after every successful "PYQ Robot" run, or by hand from Actions.
# Never overwrites existing Hindi. Needs repo secret SUPABASE_SECRET_KEY.
name: Hindi Robot
on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'कितने हिस्सों में चलाना है (1–8)'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
        default: '8'
        required: true
  workflow_run:
    workflows: ['PYQ Robot']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: hindi-robot
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - name: Build shard matrix
        id: matrix
        env:
          SHARD_COUNT: ${{ inputs.shards || '8' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          raw = os.environ["SHARD_COUNT"]
          if not re.fullmatch(r"[1-8]", raw):
              raise SystemExit("shards must be an integer from 1 to 8")
          count = int(raw)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("shards=" + json.dumps(list(range(count))) + "\\n")
          PY
  translate:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: 🚦 Control Room check (pause / enable)
        id: gate
        env:
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 dev/tools/ops/opslib.py gate hindi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-indictrans2-1B-c44b2b1
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers==4.46.3" sentencepiece einops IndicTransToolkit
      - name: Translate shard ${{ matrix.shard }}
        if: steps.gate.outputs.run == 'true'
        env:
          OPS_COUNTS: ${{ runner.temp }}/ops_counts.json
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHARD_COUNT: ${{ inputs.shards || '8' }}
        run: python3 dev/tools/hindi-robot/hindi.py --shard ${{ matrix.shard }} --of "$SHARD_COUNT"
      - name: 📒 Record run in Control Room
        if: always() && steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 dev/tools/ops/opslib.py record hindi "${{ job.status }}" "$RUNNER_TEMP/ops_counts.json"
