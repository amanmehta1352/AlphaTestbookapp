# 🏷️ Tag Robot — moves "Mixed (Untagged)" questions into chapters, learning from hand-tagged questions.
# Runs after every "PYQ Robot" run, or by hand: Actions → Tag Robot → Run workflow. Needs secret SUPABASE_SECRET_KEY.
name: Tag Robot
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'सिर्फ़ जाँच (कुछ न बदलें)'
        type: boolean
        default: false
  repository_dispatch:
    types: [pyq-imported]
permissions:
  contents: read
concurrency:
  group: tag-robot
  cancel-in-progress: false
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 🚦 Control Room check (pause / enable)
        id: gate
        env:
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 dev/tools/ops/opslib.py gate tag
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: pip install -q scikit-learn
        if: steps.gate.outputs.run == 'true'
      - name: Tag
        if: steps.gate.outputs.run == 'true'
        env:
          OPS_COUNTS: ${{ runner.temp }}/ops_counts.json
          DRY: ${{ inputs.dry_run }}
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "$DRY" = "true" ]; then python3 dev/tools/tag-robot/tagger.py --dry-run; else python3 dev/tools/tag-robot/tagger.py; fi
      - name: 📒 Record run in Control Room
        if: always() && steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: https://fzkvwkrbtykucjfdqiin.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 dev/tools/ops/opslib.py record tag "${{ job.status }}" "$RUNNER_TEMP/ops_counts.json"
