/* =========================================================================
   V2.4.0 — Update 4 · Stage B: real spaced revision, mistake reasons,
   bookmarks, practice filters. New storage key only; existing records kept.
   ========================================================================= */
const REVIEW_STATE_KEY = 'master_student_journey_v90_review_state';
const REVIEW_INTERVALS = [1, 3, 7, 14, 30];
const MISTAKE_REASONS = [
  { id: 'concept', label: 'Concept not clear' },
  { id: 'calc', label: 'Calculation' },
  { id: 'hurry', label: 'Hurry / silly' },
  { id: 'misread', label: 'Misread question' },
  { id: 'time', label: 'Ran out of time' }
];
let ReviewState = { v: 1, cards: {}, reasons: {}, bookmarks: [] };
async function hydrateReviewState() {
  try {
    const r = parseStored(await AppStorage.getRaw(REVIEW_STATE_KEY), null, REVIEW_STATE_KEY);
    if (r && r.v === 1) ReviewState = { v: 1, cards: r.cards || {}, reasons: r.reasons || {}, bookmarks: Array.isArray(r.bookmarks) ? r.bookmarks : [] };
  } catch (e) { console.warn('[Review] state unreadable; starting empty', e); }
}
function saveReviewState() {
  const s = JSON.stringify(ReviewState);
  return StorageWriteQueue.enqueue(() => AppStorage.setRawDirect(REVIEW_STATE_KEY, s)).catch(e => console.warn('[Review] save failed', e));
}
function sjAddDays(day, n) { const d = new Date(day + 'T00:00:00'); d.setDate(d.getDate() + n); return sjLocalDay(d); }

/* ---------- bookmarks ---------- */
function isBookmarked(cid) { const ws = WorkspaceManager.current().id; return ReviewState.bookmarks.some(b => b.cid === String(cid) && b.ws === ws); }
function toggleBookmark(cid) {
  const ws = WorkspaceManager.current().id; const id = String(cid || '');
  if (!id) return;
  const i = ReviewState.bookmarks.findIndex(b => b.cid === id && b.ws === ws);
  if (i >= 0) ReviewState.bookmarks.splice(i, 1); else ReviewState.bookmarks.unshift({ cid: id, ws, ts: new Date().toISOString() });
  saveReviewState();
  renderView();
}
function bookmarkButtonHtml(cid, extraClass = '') {
  const on = isBookmarked(cid);
  return `<button type="button" class="bm-btn ${on ? 'on' : ''} ${extraClass}" aria-pressed="${on}" aria-label="${on ? 'Remove bookmark' : 'Bookmark this question'}" title="${on ? 'Bookmarked' : 'Bookmark'}" onclick="toggleBookmark(${nbJsAttr(cid)})">${on ? '★' : '☆'}</button>`;
}
function bookmarkedIds() { const ws = WorkspaceManager.current().id; return new Set(ReviewState.bookmarks.filter(b => b.ws === ws).map(b => b.cid)); }

/* ---------- mistake keys and reasons ---------- */
function mbKey(m) { return m.canonicalQId ? 'c:' + m.canonicalQId : 'm:' + m.moduleId + '|' + m.qId; }
function mbCid(m) {
  if (m.canonicalQId && IndexEngine.registry.get(String(m.canonicalQId))) return String(m.canonicalQId);
  const mod = getWorkspaceModule(m.moduleId);
  const q = (mod?.groups || []).flatMap(g => g.questions || []).find(x => String(x.originalQNo) === String(m.qId));
  return q ? String(q.canonicalQId || '') : '';
}
function setMistakeReason(key, reason) {
  if (ReviewState.reasons[key] === reason) delete ReviewState.reasons[key]; else ReviewState.reasons[key] = reason;
  saveReviewState(); renderView();
}
function mistakeReasonChipsHtml(m) {
  const key = mbKey(m); const cur = ReviewState.reasons[key];
  return `<div class="mr-chips" role="group" aria-label="Why was this wrong?"><span class="mr-label">Why wrong?</span>${MISTAKE_REASONS.map(r => `<button type="button" class="mr-chip ${cur === r.id ? 'on' : ''}" aria-pressed="${cur === r.id}" onclick="setMistakeReason(${nbJsAttr(key)}, '${r.id}')">${r.label}</button>`).join('')}</div>`;
}
function mistakeReasonSummaryHtml(list) {
  if (!list.length) return '';
  const counts = new Map(MISTAKE_REASONS.map(r => [r.id, 0])); let untagged = 0;
  list.forEach(m => { const r = ReviewState.reasons[mbKey(m)]; if (r && counts.has(r)) counts.set(r, counts.get(r) + 1); else untagged++; });
  const tagged = list.length - untagged;
  if (!tagged) return `<div class="sj-empty" style="margin-bottom:10px;"><strong>Why do you make mistakes?</strong><span>Tag each mistake below with a reason. A chart of your most common reasons appears here.</span></div>`;
  const rows = MISTAKE_REASONS.map(r => ({ label: r.label, value: counts.get(r.id), valueLabel: `${counts.get(r.id)}` })).filter(r => r.value > 0).sort((a, b) => b.value - a.value);
  return `<section class="sj-card" style="margin-bottom:10px;"><div class="sj-card-head"><h2>Why mistakes happen</h2><span class="sj-chip">${tagged} of ${list.length} tagged</span></div><div class="sj-bars">${sjBarRows(rows, Math.max(...rows.map(r => r.value)), null)}</div></section>`;
}

/* ---------- spaced review queue ---------- */
function reviewItems(moduleId = null) {
  const ws = WorkspaceManager.current().id;
  const today = sjLocalDay();
  const items = [];
  (UserState.mistakeBook || []).forEach(m => {
    if (sjIsSeedMistake(m)) return;
    const mod = getWorkspaceModule(m.moduleId); if (!mod) return;
    if (moduleId && m.moduleId !== moduleId) return;
    const cid = mbCid(m); if (!cid) return;
    const q = IndexEngine.registry.get(cid); if (!q || QuestionUI.getFormat(q) === 'SUBJECTIVE') return;
    const key = 'q:' + cid; const st = ReviewState.cards[key];
    items.push({ key, kind: 'q', cid, q, mod, mistake: m, due: st?.due || today, isNew: !st });
  });
  WorkspaceManager.filterModules(AppModules || []).forEach(mod => {
    if (moduleId && mod.moduleId !== moduleId) return;
    (mod.flashcards || []).forEach((fc, i) => {
      if (!fc || !fc.front) return;
      const key = 'fc:' + mod.moduleId + ':' + i; const st = ReviewState.cards[key];
      items.push({ key, kind: 'fc', fc, mod, due: st?.due || today, isNew: !st });
    });
  });
  void ws;
  return items;
}
function reviewDue(moduleId = null) {
  const today = sjLocalDay();
  return reviewItems(moduleId).filter(x => x.due <= today).sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'q' ? -1 : 1) || a.due.localeCompare(b.due));
}
function reviewUpcoming(days = 7) {
  const today = sjLocalDay(), end = sjAddDays(today, days);
  return reviewItems().filter(x => x.due > today && x.due <= end).length;
}
function reviewSchedule(key, rating) {
  const st = ReviewState.cards[key] || { box: 0, streak: 0, n: 0 };
  let box = Number(st.box) || 0;
  if (rating === 'hard') box = 0;
  else if (rating === 'okay') box = Math.max(1, box);
  else box = Math.min(REVIEW_INTERVALS.length - 1, Math.max(2, box + 1));
  const days = REVIEW_INTERVALS[box];
  ReviewState.cards[key] = { ...st, box, due: sjAddDays(sjLocalDay(), days), last: new Date().toISOString(), n: (st.n || 0) + 1 };
  return days;
}
let RevisionSession = null;
function revisionStart(moduleId = null) {
  const due = reviewDue(moduleId);
  if (!due.length) { openCustomToast('Nothing is due for revision right now.'); return; }
  RevisionSession = { moduleId, keys: due.map(x => x.key), i: 0, answer: '', revealed: false, shownAt: Date.now(), done: 0, correct: 0, resolved: 0, note: '' };
  renderView();
}
function revisionEnd() { RevisionSession = null; renderView(); }
function revisionCurrent() {
  if (!RevisionSession) return null;
  const key = RevisionSession.keys[RevisionSession.i];
  // Keep the card on screen even if answering it just resolved its mistake.
  if (RevisionSession.cache && RevisionSession.cache.key === key) return RevisionSession.cache;
  const it = reviewItems(RevisionSession.moduleId).find(x => x.key === key) || null;
  RevisionSession.cache = it;
  return it;
}
function revisionAnswer(letter) {
  const it = revisionCurrent(); if (!it || it.kind !== 'q' || RevisionSession.answer) return;
  const L = String(letter).toUpperCase();
  RevisionSession.answer = L; RevisionSession.revealed = true;
  const ok = L === String(it.q.answer || '').toUpperCase();
  try { LearningHistory.recordPractice(it.q, it.mod, L, (Date.now() - RevisionSession.shownAt) / 1000, 'revision'); } catch (e) { console.warn(e); }
  const st = ReviewState.cards[it.key] || { box: 0, streak: 0, n: 0 };
  st.streak = ok ? (Number(st.streak) || 0) + 1 : 0;
  ReviewState.cards[it.key] = st;
  if (ok) RevisionSession.correct++;
  RevisionSession.note = '';
  if (ok && st.streak >= 2) {
    const idx = (UserState.mistakeBook || []).indexOf(it.mistake);
    if (idx >= 0) { UserState.mistakeBook.splice(idx, 1); saveUserState(); RevisionSession.resolved++; RevisionSession.note = '✓ Correct twice in a row — removed from the Mistake Book.'; }
  }
  saveReviewState();
  renderView();
}
function revisionReveal() { if (RevisionSession) { RevisionSession.revealed = true; renderView(); } }
function revisionRate(rating) {
  const it = revisionCurrent(); if (!it) { revisionSkip(); return; }
  if (it.kind === 'q' && RevisionSession.answer && RevisionSession.answer !== String(it.q.answer || '').toUpperCase()) rating = 'hard';
  reviewSchedule(it.key, rating);
  saveReviewState();
  RevisionSession.done++;
  revisionSkip();
}
function revisionSkip() {
  if (!RevisionSession) return;
  RevisionSession.i++; RevisionSession.answer = ''; RevisionSession.revealed = false; RevisionSession.shownAt = Date.now(); RevisionSession.note = RevisionSession.i < RevisionSession.keys.length ? RevisionSession.note : RevisionSession.note;
  renderView();
}
function revisionCardHtml() {
  const S = RevisionSession;
  const total = S.keys.length;
  if (S.i >= total) {
    return `<section class="rv-card rv-done"><div class="rv-emoji" aria-hidden="true">🎉</div><h2>Revision done</h2><p>${S.done} reviewed · ${S.correct} correct${S.resolved ? ` · ${S.resolved} removed from the Mistake Book` : ''}</p><p class="sj-note sj-muted">Next reviews are scheduled automatically (1, 3, 7, 14, 30 days).</p><div class="rs-actions"><button type="button" class="btn-nav primary" onclick="revisionEnd()">Back to revision</button><button type="button" class="btn-nav" onclick="RevisionSession=null;navigate('home')">Home</button></div></section>`;

/* ---------- derived metrics ---------- */
function sjDayDiff(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function sjStreak() {
  const days = learningStats().byDay;
  const today = sjLocalDay();
  let cur = days.has(today) ? today : sjAddDays(today, -1);
  let streak = 0;
  while (days.has(cur)) { streak++; cur = sjAddDays(cur, -1); }
  const sorted = [...days.keys()].filter(Boolean).sort();
  let best = 0, run = 0, prev = '';
  sorted.forEach(d => { run = prev && sjDayDiff(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return { streak, best, activeToday: days.has(today) };
}
function sjWeekStart(day) { const d = new Date(day + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; return sjAddDays(day, -wd); }
function sjWeekly() {
  const st = learningStats(); const today = sjLocalDay();
  const thisStart = sjWeekStart(today), lastStart = sjAddDays(thisStart, -7);
  const sum = (from, to) => { let a = 0, c = 0, s = 0; st.byDay.forEach((v, k) => { if (k >= from && k <= to) { a += v.answered; c += v.correct; s += v.sec; } }); return { a, c, s, acc: a ? Math.round(c / a * 100) : null }; };
  const ws = WorkspaceManager.current().id;
  const tests = (from, to) => ResultHistory.filter(r => r.ws === ws && r.day >= from && r.day <= to).length;
  return { thisW: { ...sum(thisStart, today), t: tests(thisStart, today) }, lastW: { ...sum(lastStart, sjAddDays(thisStart, -1)), t: tests(lastStart, sjAddDays(thisStart, -1)) } };
}
function sjCoverage() {
  const ws = WorkspaceManager.current().id;
  const bank = new Set();
  WorkspaceManager.filterModules(AppModules || []).forEach(m => (m.groups || []).forEach(g => (g.questions || []).forEach(q => bank.add(String(q.canonicalQId || '')))));
  let done = 0; learningStats(ws).unique.forEach(id => { if (bank.has(id)) done++; });
  return { done, total: bank.size };
}
function sjFmtMin(sec) { const m = Math.round((Number(sec) || 0) / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }

/* ---------- Pomodoro (real timer; only completed focus sessions count) ---------- */
let PomoInterval = null;
function pomoState() {
  if (!StudySettings.pomoState) StudySettings.pomoState = { phase: 'focus', running: false, endAt: 0, remaining: (StudySettings.pomo.focus || 25) * 60 };
  return StudySettings.pomoState;
}
function pomoPhaseLength(phase) { return (phase === 'focus' ? (StudySettings.pomo.focus || 25) : (StudySettings.pomo.brk || 5)) * 60; }
function pomoRemaining() { const p = pomoState(); return p.running ? Math.max(0, Math.ceil((p.endAt - Date.now()) / 1000)) : Math.max(0, p.remaining); }
function pomoStart() { const p = pomoState(); if (p.running) return; p.endAt = Date.now() + pomoRemaining() * 1000; p.running = true; saveStudySettings(); pomoEnsureTimer(); pomoPaint(); }
function pomoPause() { const p = pomoState(); if (!p.running) return; p.remaining = pomoRemaining(); p.running = false; saveStudySettings(); pomoPaint(); }
function pomoReset() { const p = pomoState(); p.running = false; p.remaining = pomoPhaseLength(p.phase); saveStudySettings(); pomoPaint(); }
function pomoSwitch(phase) { const p = pomoState(); p.phase = phase; p.running = false; p.remaining = pomoPhaseLength(phase); saveStudySettings(); renderView(); }
function pomoSetLength(kind, min) { StudySettings.pomo[kind] = min; const p = pomoState(); if (!p.running && ((kind === 'focus' && p.phase === 'focus') || (kind === 'brk' && p.phase === 'break'))) p.remaining = min * 60; saveStudySettings(); renderView(); }
function pomoComplete() {
  const p = pomoState();
  const finished = p.phase;
  if (finished === 'focus') { const day = sjLocalDay(new Date(p.endAt || Date.now())); StudySettings.focusLog[day] = (Number(StudySettings.focusLog[day]) || 0) + pomoPhaseLength('focus'); }
  p.phase = finished === 'focus' ? 'break' : 'focus'; p.running = false; p.remaining = pomoPhaseLength(p.phase);
  saveStudySettings();
  try { navigator.vibrate && navigator.vibrate([180, 80, 180]); } catch (_) {}
  const msg = finished === 'focus' ? tx('Focus session complete — take a short break.','Focus session पूरा — थोड़ा आराम करें।') : tx('Break over — ready for the next focus session?','आराम पूरा — अगले focus session के लिए तैयार?');
  if (Route?.page === 'test') cbtInlineToast(msg); else if (Route?.page === 'home') { renderView(); sjFlash(msg); } else openCustomToast(msg);
}
function pomoTick() {
  const p = pomoState();
  if (p.running && Date.now() >= p.endAt) pomoComplete();
  pomoPaint();
  if (p.running) pomoEnsureTimer(); else if (PomoInterval) { clearInterval(PomoInterval); PomoInterval = null; }
}
function pomoEnsureTimer() { if (!PomoInterval) PomoInterval = setInterval(pomoTick, 1000); }
function pomoPaint() {
  const el = document.getElementById('gxPomoTime'); if (!el) return;
  const p = pomoState(); const r = pomoRemaining(); const len = pomoPhaseLength(p.phase);
  el.textContent = `${String(Math.floor(r / 60)).padStart(2, '0')}:${String(r % 60).padStart(2, '0')}`;
  const ring = document.getElementById('gxPomoRing'); if (ring) ring.style.strokeDashoffset = String(264 * (r / Math.max(1, len)));
  const btn = document.getElementById('gxPomoBtn'); if (btn) { btn.textContent = p.running ? tx('Pause','रोकें') : (r < len ? tx('Resume','जारी रखें') : tx('Start','शुरू')); btn.onclick = p.running ? pomoPause : pomoStart; }
}

  return `<section class="gx-card gx-goal"><div class="gx-head"><h2>${tx('Daily goal','दैनिक लक्ष्य')}</h2><button type="button" class="gx-link" onclick="sjOpenGoalSettings()">${tx('Edit','बदलें')}</button></div>

function gxStreakWidget() {
  const s = sjStreak(); const days = learningStats().byDay; const today = sjLocalDay();
  const start = sjAddDays(sjWeekStart(today), -49); // 8 weeks, Monday-first
  let cells = '';
  for (let w = 0; w < 8; w++) for (let dd = 0; dd < 7; dd++) {
    const day = sjAddDays(start, w * 7 + dd);
    const n = days.get(day)?.answered || 0;
    const lvl = day > today ? 'f' : n === 0 ? 0 : n < 10 ? 1 : n < 30 ? 2 : 3;
    cells += `<span class="gx-cell l${lvl}" style="grid-column:${w + 1};grid-row:${dd + 1}" title="${escapeHtml(new Date(day + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }))}: ${n} ${tx('answered','हल किए')}"></span>`;
  }
  return `<section class="gx-card gx-streak"><div class="gx-head"><h2>${tx('Daily streak','लगातार दिन')}</h2><span class="gx-chip">${tx(`Best ${s.best} day${s.best === 1 ? '' : 's'}`,`सबसे ज़्यादा ${s.best} दिन`)}</span></div>
    <div class="gx-streak-top"><b>${s.streak}</b><span>${tx(`day${s.streak === 1 ? '' : 's'} in a row`,'दिन लगातार')}${s.streak && !s.activeToday ? tx(' · answer a question today to keep it',' · इसे बनाए रखने के लिए आज एक सवाल हल करें') : ''}</span></div>
    <div class="gx-cal" role="img" aria-label="${tx('Activity calendar for the last 8 weeks','पिछले 8 हफ़्तों का calendar')}">${cells}</div>
    <div class="gx-legend"><span>${tx('Less','कम')}</span><i class="gx-cell l0"></i><i class="gx-cell l1"></i><i class="gx-cell l2"></i><i class="gx-cell l3"></i><span>${tx('More','ज़्यादा')}</span></div></section>`;

function gxTrendWidget(results) {
  const pts = results.slice(0, 10).reverse();
  if (pts.length < 2) return `<section class="gx-card gx-trend"><div class="gx-head"><h2>${tx('Score trend','Score की रेखा')}</h2></div><div class="gx-empty"><strong>${pts.length ? tx('One test so far','अभी एक ही test') : tx('No tests yet','अभी कोई test नहीं')}</strong><span>${tx('Submit at least two tests to see your accuracy trend.','Accuracy की रेखा देखने के लिए कम से कम दो test दें।')}</span><button type="button" class="gx-btn" onclick="navigate('native_builder')">${tx('Build a test','Test बनाएँ')}</button></div></section>`;
  const W = 320, H = 140, L = 30, R = 10, T = 12, B = 22;
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - v / 100);
  const line = pts.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(Number(r.accuracy) || 0).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const last = pts[pts.length - 1];
  const dots = pts.map((r, i) => `<g class="gx-pt" tabindex="0" role="button" aria-label="${escapeHtml(r.topicTitle || 'Test')}: ${Number(r.accuracy) || 0}% on ${escapeHtml(sjFormatWhen(r.ts))}" onclick="gxTrendInfo(${i})" onkeydown="if(event.key==='Enter')gxTrendInfo(${i})"><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.accuracy) || 0).toFixed(1)}" r="14" class="gx-hit"/><circle cx="${x(i).toFixed(1)}" cy="${y(Number(r.accuracy) || 0).toFixed(1)}" r="4.5" class="gx-dot"/><title>${escapeHtml(r.topicTitle || 'Test')} · ${Number(r.accuracy) || 0}% · ${escapeHtml(sjFormatWhen(r.ts))}</title></g>`).join('');
  gxTrendInfo.pts = pts;
  return `<section class="gx-card gx-trend"><div class="gx-head"><h2>${tx('Score trend','Score की रेखा')}</h2><span class="gx-chip">${tx(`Last ${pts.length} tests · accuracy`,`पिछले ${pts.length} test · accuracy`)}</span></div>
    <svg class="gx-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy of your last ${pts.length} tests">
      <defs><linearGradient id="gxArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gx-blue)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gx-purple)" stop-opacity="0"/></linearGradient></defs>
      ${[0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gx-grid"/><text x="${L - 6}" y="${y(v) + 3}" class="gx-axis" text-anchor="end">${v}%</text>`).join('')}
      <path d="${area}" fill="url(#gxArea)"/><path d="${line}" class="gx-line"/>${dots}
      <text x="${x(pts.length - 1) - 6}" y="${y(Number(last.accuracy) || 0) - 10}" class="gx-lastlabel" text-anchor="end">${Number(last.accuracy) || 0}%</text>
    </svg><p class="gx-note" id="gxTrendNote">${tx('Tap a point for details.','जानकारी के लिए किसी बिंदु पर tap करें।')}</p></section>`;
}

function nbSubjectAccuracy(key) {

/* =========================================================================
   V2.5.0 — Phase A1: strict import, stable IDs, exact exam/subject mapping
   Rules: nothing is guessed. A required field that is missing stops that
   question with its line number. Existing question IDs never change.
   ========================================================================= */
function importHash(str) {
  // cyrb53 — short, stable, non-cryptographic content hash
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function importNormText(v) { return String(v || '').normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim(); }
// Same stem + same options = same question. Symbols, digits and decimals count.
function importFingerprint(q) {
  return importNormText(q.QUESTION_EN || q.QUESTION_HI) + '|' + (q.options || []).map(o => importNormText(o.en || o.hi)).join('|');
}
function importContentHash(q) {
  return importHash([importNormText(q.QUESTION_EN), importNormText(q.QUESTION_HI), ...(q.options || []).map(o => importNormText(o.en) + '/' + importNormText(o.hi)), String(q.answer || ''), importNormText(q.EXPLANATION)].join('§'));
}

/* ---------- exact subject / exam mapping ---------- */
function normalizeSubjectKey(raw) {
  const s = String(raw || '').normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const w = s.split(/[^a-z0-9\u0900-\u097f]+/).filter(Boolean);
  const has = x => w.includes(x);
  if (has('computer')) return 'computer';
  if (has('math') || has('maths') || has('mathematics') || has('quant') || has('quantitative') || has('arithmetic') || s.includes('गणित')) return 'maths';
  if (has('political')) return s;
  if (has('science') || has('physics') || has('chemistry') || has('biology') || s.includes('विज्ञान')) return 'science';
  if (has('reasoning') || has('intelligence') || s === 'mental ability' || s.includes('तर्क')) return 'reasoning';
  if (has('english')) return 'english';
  return s;
}
function deriveExamIdStrict(rawExamName) {
  const raw = String(rawExamName || '').trim();
  if (!raw) return '';
  const s = slugify(raw);
  const t = s.split('-').filter(Boolean);
  const has = x => t.includes(x);
  const pair = (a, b) => t.some((x, i) => x === a && t[i + 1] === b);
  if (has('ssc') && has('cgl')) return 'ssc-cgl';
  if (has('ssc') && has('chsl')) return 'ssc-chsl';
  if (has('ssc') && has('je')) return 'ssc-je';
  if (t.length === 1 && has('ssc')) return 'ssc-general';
  if (has('ntpc')) return 'rrb-ntpc';
  if (has('alp')) return 'rrb-alp';
  if (pair('group', 'd') || has('groupd')) return 'rrb-group-d';
  if (has('rrb') && has('je')) return 'rrb-je';
  if (has('rpf') && (has('si') || pair('s', 'i') || pair('sub', 'inspector'))) return 'rpf-si';
  if (has('rpf') && has('constable')) return 'rpf-constable';
  if (has('upsc') && (t.length === 1 || has('cse') || has('ias') || has('civil') || has('prelims'))) return 'upsc-cse';
  if (has('bpsc') && (t.length === 1 || has('cce'))) return 'bpsc-cce';
  if (t.length === 1 && has('dpsc')) return 'dpsc';
  return s;
}
function examDisplayName(examId, raw) { return UniversalExamRegistry.knownProfiles[examId]?.name || String(raw || examId).trim(); }
UniversalExamRegistry.deriveExamIdLegacy = UniversalExamRegistry.deriveExamId.bind(UniversalExamRegistry);
// Keep a stored exam id unless the question's exam name was really changed (e.g. by "Fix exam/year").
function syncKeepExamId(q, priorMeta) {
  const id = priorMeta?.examId; if (!id) return '';
  const nameNow = String(q.EXAM_NAME || q.examInfo || priorMeta.exam || '').trim();
  if (!nameNow || nameNow === priorMeta.exam || examDisplayName(id, priorMeta.exam) === nameNow) return id;
  try { if (UniversalExamRegistry.deriveExamIdLegacy(nameNow) === id) return id; } catch (_) {}
  return '';
}

/* ---------- block parser ---------- */
// Import-screen defaults (V2.10.0): values the admin types once on the import
// screen fill only the fields a block leaves empty. The file always wins.
const IMPORT_DEFAULT_KEYS = ['EXAM_NAME', 'YEAR', 'SHIFT', 'SUBJECT', 'CHAPTER', 'TOPIC'];
const IMPORT_DEFAULT_LABEL = { EXAM_NAME: 'Exam', YEAR: 'Year', SHIFT: 'Shift', SUBJECT: 'Subject', CHAPTER: 'Chapter', TOPIC: 'Topic' };
function importApplyDefaults(f, defaults, bi, warnings, filledCount) {
  const alias = { EXAM_NAME: ['EXAM_NAME', 'EXAM'], SHIFT: ['SHIFT', 'PAPER', 'PAPER_DATE'] };
  IMPORT_DEFAULT_KEYS.forEach(k => {
    const def = String((defaults || {})[k] || '').trim(); if (!def) return;
    const keys = alias[k] || [k];
    const have = keys.map(x => String(f[x] || '').trim()).find(Boolean);
    if (!have) { f[k] = def; filledCount[k] = (filledCount[k] || 0) + 1; }
    else if (k !== 'TOPIC' && importNormText(have) !== importNormText(def)) warnings.push(`Block ${bi + 1}: file में ${IMPORT_DEFAULT_LABEL[k]} "${have.slice(0, 40)}" है, ऊपर "${def.slice(0, 40)}" भरा — file वाला लिया`);
  });
}
const IMPORT_FIELDS = new Set(['SOURCE_QUESTION_NO', 'QUESTION_NO', 'Q_NO', 'QUESTION_ID', 'EXAM_NAME', 'EXAM', 'EXAM_BOARD', 'YEAR', 'SHIFT', 'PAPER', 'PAPER_DATE',
  'SUBJECT', 'CHAPTER', 'TOPIC', 'SUB_TOPIC', 'SUBTOPIC', 'SUB_CONCEPT', 'CONCEPT', 'FORMULA', 'COURSE', 'TYPE', 'QUESTION_BASE', 'CATEGORY', 'DIFFICULTY',
  'SOURCE_TYPE', 'QUESTION_SOURCE', 'SOURCE', 'QUESTION_EN', 'QUESTION_HI', 'QUESTION', 'A_EN', 'B_EN', 'C_EN', 'D_EN', 'A_HI', 'B_HI', 'C_HI', 'D_HI', 'A', 'B', 'C', 'D',
  'ANSWER', 'SOURCE_ANSWER', 'EXPLANATION_EN', 'EXPLANATION_HI', 'EXPLANATION', 'SOLUTION', 'SOLUTION_EN', 'SOLUTION_HI', 'CALCULATION', 'HINT', 'HINT_1', 'HINT_2', 'NOTE',
  'CURRICULUM_ID', 'BOARD_ID', 'CLASS_ID', 'STREAM_ID', 'SUBJECT_ID', 'CHAPTER_ID', 'TOPIC_ID', 'LEARNING_OUTCOME_ID', 'LEARNING_OUTCOME', 'TAGS', 'MARKS']);
const IMPORT_LONG = /^(QUESTION|QUESTION_EN|QUESTION_HI|EXPLANATION|EXPLANATION_EN|EXPLANATION_HI|SOLUTION|SOLUTION_EN|SOLUTION_HI|CALCULATION|HINT|HINT_1|HINT_2|NOTE)$/;
const IMPORT_AFTER_ANSWER = /^(EXPLANATION|EXPLANATION_EN|EXPLANATION_HI|SOLUTION|SOLUTION_EN|SOLUTION_HI|CALCULATION|HINT|HINT_1|HINT_2|NOTE)$/;
function importParseBlock(text, firstLine) {
  const lines = String(text).split(/\r?\n/);
  const suffixed = lines.some(l => /^\s*[A-D]_(EN|HI)\s*:/i.test(l));
  const fields = {}, lineOf = {}, warnings = [];
  let cur = null;
  lines.forEach((line, i) => {
    const ln = firstLine + i;
    const m = line.match(/^\s*([A-Za-z][A-Za-z0-9_]*)\s*:\s?(.*)$/);
    if (m) {
      const key = m[1].toUpperCase();
      const letter = /^[A-D]$/.test(key);
      let starts = false;
      if (IMPORT_FIELDS.has(key)) {
        // A:/B:/C:/D: are options only in old-style blocks, never inside an explanation.

  const s = r.stats || { new: 0, changed: 0, unchanged: 0, missing: 0 };
  const list = (arr, fn, n = 8) => arr.slice(0, n).map(fn).join('') + (arr.length > n ? `<li>… और ${arr.length - n}</li>` : '');
  const errHtml = r.validationErrors.length ? `<div class="ir-box bad"><b>❌ ${r.validationErrors.length} सवाल में गलती — ठीक करके file दोबारा चुनें</b><ul>${list(r.validationErrors, e => `<li>Block ${e.index} (line ${e.line}, Q.${escapeHtml(e.qNo)}): ${escapeHtml(e.errors.join(' · '))}</li>`)}</ul></div>` : '';
  const dupHtml = r.duplicateBatch.length ? `<div class="ir-box bad"><b>❌ File के अंदर duplicate</b><ul>${list(r.duplicateBatch, d => `<li>Block ${d.index} (line ${d.line}): ${escapeHtml(d.reason)}</li>`)}</ul></div>` : '';
  const extHtml = r.duplicateExternal.length ? `<div class="ir-box bad"><b>❌ ${r.duplicateExternal.length} सवाल की ID पहले से दूसरे topic में है</b><ul>${list(r.duplicateExternal, d => `<li>Q.${escapeHtml(d.qNo)}: ${escapeHtml(d.id)} → ${escapeHtml(d.ownerTopic)}${d.otherWorkspace ? ' (दूसरा workspace)' : ''}</li>`)}</ul></div>` : '';
  const warnHtml = r.warnings.length ? `<details class="ir-box warn"><summary>⚠️ ${r.warnings.length} ध्यान देने वाली बातें</summary><ul>${list(r.warnings, w => `<li>${escapeHtml(w)}</li>`, 30)}</ul></details>` : '';
  const missingHtml = s.missing ? `<label class="ir-remove"><input type="checkbox" id="irRemoveMissing" onchange="irToggleRemove(this.checked)"> <span>इस topic के <b>${s.missing}</b> पुराने सवाल इस file में नहीं हैं। <b>उन्हें हटाएँ</b> (टिक न करें तो वे रहेंगे)</span></label>` : '';
  const rows = r.questions.slice(0, 30).map(q => `<div class="import-q-row"><div style="display:flex;justify-content:space-between;gap:8px;"><b>Q.${escapeHtml(q.originalQNo)} • ${escapeHtml(q.metadata.topic)}</b><span class="ir-tag ${String(q.diffStatus || '').toLowerCase()}">${q.importState === 'ERROR' ? 'ERROR' : q.diffStatus === 'NEW' ? 'नया' : q.diffStatus === 'CHANGED' ? 'बदला' : 'वही'}</span></div><div style="margin-top:3px;">${escapeHtml(q.QUESTION_EN || q.QUESTION_HI || '')}</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">उत्तर: ${escapeHtml(q.answer || '—')} · ${escapeHtml([q.metadata.exam, q.metadata.year].filter(Boolean).join(' ') || '—')} · ID ${escapeHtml(q.canonicalQId)}</div></div>`).join('');
  document.getElementById('modalSheetBody').innerHTML = `
    ${renderImportStep(2)}
    <div class="import-preview">
      <div class="import-preview-head"><div><b>🔍 जाँच का नतीजा</b><div style="font-size:11px;color:var(--text-muted);">${escapeHtml(r.sourceFile)}</div></div><span class="tax-badge ${blocked ? 'hard' : 'easy'}">${blocked ? 'रुका' : 'तैयार'}</span></div>
      <div class="import-stat-grid"><div class="import-stat"><b>${r.totalQuestions}</b><span>FILE में</span></div><div class="import-stat"><b>${s.new}</b><span>नए</span></div><div class="import-stat"><b>${s.changed}</b><span>बदले</span></div><div class="import-stat"><b>${s.unchanged}</b><span>वही</span></div></div>
      <div style="padding:0 10px 8px;font-size:12px;"><b>Topic:</b> ${escapeHtml(r.topicTitle)} · <b>Subject:</b> ${escapeHtml(subjectDisplayName(r.detectedSubject))} · <b>Exam:</b> ${escapeHtml(r.examsRegistered.join(', ') || '—')}${r.replacesExistingModule ? ' · <b>यह topic पहले से है — सवाल जुड़ेंगे/अपडेट होंगे</b>' : ''}</div>
      ${errHtml}${dupHtml}${extHtml}${missingHtml}${warnHtml}
      ${!blocked ? `<div class="ir-box good">✓ सब ज़रूरी fields मौजूद हैं, हर सवाल का उत्तर A–D में है।</div>` : ''}
      <div style="padding:8px 10px 4px;font-size:11px;font-weight:900;">सवाल ${r.totalQuestions > 30 ? '(पहले 30)' : ''}</div><div class="import-q-list">${rows}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn-nav" style="flex:1;" onclick="PendingImportTransaction=null;openImportModal()">↩️ वापस</button>
      <button class="btn-nav primary" style="flex:2;" ${blocked ? 'disabled' : ''} onclick="confirmImportCommit()">✅ Import करें</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center;">अभी तक कुछ save नहीं हुआ है। Import से पहले अपने-आप एक backup बनेगा।</div>`;
}
function irToggleRemove(on) { if (PendingImportTransaction) PendingImportTransaction.removeMissing = !!on; }

/* =========================================================================
   V2.5.0 — Phase A2: data safety, auto backups, restore, one-tab guard
   ========================================================================= */
var DataHealth = { corrupt: [], failedKeys: new Map(), readOnly: false, persisted: null, lastSaveOk: '' };
const AUTOSNAP_INDEX_KEY = 'master_student_journey_v90_autosnap_index';
const AUTOSNAP_SLOTS = 3;
const AUTOSNAP_KEY = n => `master_student_journey_v90_autosnap_${n}`;
const BACKUP_SCHEMA = 'mtb-backup-2';
function appVersionLabel() { return document.querySelector('meta[name="app-version"]')?.content || document.querySelector('meta[content^="V2."]')?.content || 'V2.5.0'; }
function buildBackupPayload(override = {}) {
  return {
    schema: BACKUP_SCHEMA, exportedAt: new Date().toISOString(), app: 'MASTER TEST-BOOK', version: appVersionLabel(),
    modules: override.modules || AppModules, userState: UserState, importHistory: override.importHistory || getImportHistory(),
    attemptHistory: AttemptHistory, resultHistory: ResultHistory, builderTemplates: BuilderTemplates, reviewState: ReviewState, studySettings: StudySettings
  };
}
function backupCounts(p) {
  const mods = Array.isArray(p?.modules) ? p.modules : [];
  return {
    modules: mods.length, questions: mods.reduce((n, m) => n + (m.groups || []).reduce((a, g) => a + (g.questions || []).length, 0), 0),
    attempts: Array.isArray(p?.attemptHistory) ? p.attemptHistory.length : 0, results: Array.isArray(p?.resultHistory) ? p.resultHistory.length : 0,
    bookmarks: Array.isArray(p?.reviewState?.bookmarks) ? p.reviewState.bookmarks.length : 0
  };
}
function validateBackupPayload(p) {
  const errors = [];
  if (!p || typeof p !== 'object' || Array.isArray(p)) return { ok: false, errors: ['यह Master TestBook backup file नहीं है।'] };
  if (!Array.isArray(p.modules)) errors.push('इसमें सवालों (modules) की list नहीं है।');
  else p.modules.forEach((m, i) => {
    if (!m || typeof m !== 'object' || !m.moduleId || !Array.isArray(m.groups)) errors.push(`Module ${i + 1} अधूरा है।`);
    else m.groups.forEach(g => { if (!g || !Array.isArray(g.questions)) errors.push(`Module ${m.moduleId}: group अधूरा है।`); else g.questions.forEach(q => { if (!q || !(q.canonicalQId || q.originalQNo)) errors.push(`Module ${m.moduleId}: एक सवाल की ID नहीं है।`); }); });
  });
  [['attemptHistory', 'array'], ['resultHistory', 'array'], ['importHistory', 'array'], ['builderTemplates', 'array'], ['userState', 'object'], ['reviewState', 'object'], ['studySettings', 'object']].forEach(([k, t]) => {
    if (p[k] === undefined || p[k] === null) return;
    if (t === 'array' ? !Array.isArray(p[k]) : (typeof p[k] !== 'object' || Array.isArray(p[k]))) errors.push(`"${k}" का format गलत है।`);
  });
  return { ok: !errors.length, errors: errors.slice(0, 6), counts: backupCounts(p), exportedAt: p.exportedAt || '', version: p.version || '' };
}

var DataSafety = {
  ok(key) { if (DataHealth.failedKeys.delete(key)) this.paint(); DataHealth.lastSaveOk = new Date().toISOString(); },
  fail(key, err) {
    const quota = err && (err.name === 'QuotaExceededError' || /quota/i.test(String(err.message || '')));
    DataHealth.failedKeys.set(key, quota ? 'QUOTA' : 'ERROR');
    console.warn('[Storage] save failed', key, err);
    this.paint();
  },
  async quarantine() {
    for (const c of DataHealth.corrupt) {
      if (c.savedAs) continue;
      const k = `${c.key}__damaged_${Date.now()}`;
      try { await AppStorage.setRawDirect(k, c.raw); c.savedAs = k; } catch (e) { console.warn('[Storage] could not keep damaged copy', e); }
    }
    this.paint();
  },
  async readIndex() { const raw = await AppStorage.getRaw(AUTOSNAP_INDEX_KEY); try { const v = JSON.parse(raw || '[]'); return Array.isArray(v) ? v : []; } catch (_) { return []; } },
  async snapshot(reason, override) {
    if (DataHealth.readOnly) return null;
    await StorageWriteQueue.flush();
    const idx = await this.readIndex();
    const used = new Set(idx.map(x => x.slot));
    let slot = [...Array(AUTOSNAP_SLOTS)].map((_, i) => i + 1).find(n => !used.has(n));
    if (!slot) slot = idx.slice().sort((a, b) => String(a.at).localeCompare(String(b.at)))[0].slot;
    const payload = buildBackupPayload(override || {});
    const entry = { slot, at: payload.exportedAt, reason: String(reason || '').slice(0, 80), counts: backupCounts(payload) };
    const next = [entry, ...idx.filter(x => x.slot !== slot)].sort((a, b) => String(b.at).localeCompare(String(a.at)));
    await AppStorage.commitMany({ [AUTOSNAP_KEY(slot)]: JSON.stringify(payload), [AUTOSNAP_INDEX_KEY]: JSON.stringify(next) });
    return entry;
  },
  async dailySnapshot() {
    try {
      const idx = await this.readIndex();
      const last = idx[0] ? Date.parse(idx[0].at) : 0;
      const hasData = (AttemptHistory || []).length || (ImportHistory || []).length;
      if (hasData && Date.now() - last > 24 * 3600 * 1000) await this.snapshot('रोज़ का अपने-आप backup');
    } catch (e) { console.warn('[Backup] daily snapshot skipped', e); }
  },
  paint() {
    let el = document.getElementById('dsBanner');
    const failed = DataHealth.failedKeys.size, quota = [...DataHealth.failedKeys.values()].includes('QUOTA');
    const unseenCorrupt = DataHealth.corrupt.filter(c => !c.dismissed);
    let html = '';
    if (DataHealth.readOnly) html = `<span>🔒 यह ऐप दूसरे tab में खुला है। यहाँ के बदलाव save नहीं होंगे।</span><button type="button" onclick="tabGuardTakeOver()">यहीं इस्तेमाल करें</button>`;
    else if (failed) html = `<span>⚠️ ${quota ? 'फ़ोन में जगह भर गई —' : ''} आपका पिछला बदलाव save नहीं हुआ।</span><button type="button" onclick="retryAllSaves()">फिर कोशिश करें</button><button type="button" onclick="downloadDataSnapshot()">Backup लें</button>`;
    else if (unseenCorrupt.length) html = `<span>⚠️ कुछ पुराना data पढ़ा नहीं जा सका। उसे सुरक्षित अलग रखा गया है।</span><button type="button" onclick="openBackupCenter()">देखें</button>`;
    if (!html) { if (el) el.remove(); document.body.classList.remove('ds-banner-on'); return; }
    if (!el) { el = document.createElement('div'); el.id = 'dsBanner'; el.setAttribute('role', 'alert'); document.body.appendChild(el); }
    el.innerHTML = html; document.body.classList.add('ds-banner-on');
  }
};
function retryAllSaves() {
  DataHealth.failedKeys.clear();
  [saveModules, saveUserState, saveImportHistory, saveReviewState, saveStudySettings, saveBuilderTemplates, saveAttemptHistory, saveResultHistory].forEach(fn => { try { fn(); } catch (_) {} });
  DataSafety.paint();
}

/* ---------- one tab at a time ---------- */
var TabGuard = { id: Math.random().toString(36).slice(2), ch: null };
try {
  TabGuard.ch = new BroadcastChannel('master-testbook-v1');
  TabGuard.ch.onmessage = e => { const m = e.data || {}; if (m.from === TabGuard.id) return; if (m.type === 'hello' || m.type === 'takeover') { DataHealth.readOnly = true; DataSafety.paint(); } };
} catch (_) {}
function tabGuardAnnounce() { try { TabGuard.ch?.postMessage({ type: 'hello', from: TabGuard.id }); } catch (_) {} }
function tabGuardTakeOver() { try { TabGuard.ch?.postMessage({ type: 'takeover', from: TabGuard.id }); } catch (_) {} location.reload(); }

/* ---------- backup download / restore ---------- */
function downloadDataSnapshot() {
  try { StudySettings.lastBackupAt = new Date().toISOString(); saveStudySettings(); } catch (_) {}
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MASTER_TESTBOOK_BACKUP_${new Date().toISOString().slice(0, 10)}_${Date.now()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  if (document.querySelector('#modalSheetBody .bk')) setTimeout(() => openBackupCenter(), 300);
}
let PendingRestore = null;
function fmtWhen(iso) { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function countsLine(c) { return `${c.questions} सवाल · ${c.attempts} जवाब · ${c.results} टेस्ट · ${c.bookmarks} bookmark`; }
async function openBackupCenter() {
  closeDrawer();
  const idx = await DataSafety.readIndex().catch(() => []);
  const cur = backupCounts(buildBackupPayload());
  const failed = DataHealth.failedKeys.size;
  const corrupt = DataHealth.corrupt;
  openModal('💾 Backup और Restore', `<div class="bk">
    <div class="bk-status ${failed ? 'bad' : 'good'}"><b>${failed ? '⚠️ कुछ बदलाव save नहीं हुए' : '✓ Data save हो रहा है'}</b><span>${countsLine(cur)}</span><span>Storage: ${AppStorage.useFallback ? 'छोटी (localStorage)' : 'IndexedDB'} · ${DataHealth.persisted === true ? 'Browser हटाएगा नहीं (persistent)' : 'Browser जगह कम होने पर हटा सकता है'} · आख़िरी backup: ${StudySettings.lastBackupAt ? fmtWhen(StudySettings.lastBackupAt) : 'कभी नहीं'}</span></div>
    ${corrupt.length ? `<div class="bk-status bad"><b>⚠️ ${corrupt.length} हिस्सा पढ़ा नहीं जा सका</b><span>उसकी जगह साफ़ data लिया गया। खराब copy सुरक्षित अलग रखी है।</span>${corrupt.map((c, i) => `<button type="button" class="btn-action-sm" onclick="downloadDamaged(${i})">⬇️ खराब copy download (${escapeHtml(c.label)})</button>`).join('')}</div>` : ''}
    <button type="button" class="btn-nav primary bk-wide" onclick="downloadDataSnapshot()">⬇️ अभी Backup file download करें</button>
    <label class="bk-file"><span>⬆️ Backup file से वापस लाएँ</span><input type="file" accept=".json,application/json" onchange="restoreFromFile(this.files[0])"></label>
    <div id="bkRestore"></div>
    <h4>अपने-आप बने backup (आख़िरी ${AUTOSNAP_SLOTS})</h4>
    ${idx.length ? idx.map(e => `<div class="bk-row"><div><b>${escapeHtml(e.reason || 'Backup')}</b><small>${fmtWhen(e.at)} · ${countsLine(e.counts || {})}</small></div><button type="button" class="btn-action-sm" onclick="restoreFromSlot(${Number(e.slot)})">वापस लाएँ</button></div>`).join('') : '<p class="bk-note">अभी कोई नहीं। Import, delete, restore और reset से पहले, और रोज़ एक बार अपने-आप बनता है।</p>'}
    <p class="bk-note">Backup file को Google Drive या WhatsApp पर खुद को भेजकर रखें। फ़ोन बदलने पर उसी से data वापस आएगा।</p>
  </div>`);
}
function downloadDamaged(i) {
  const c = DataHealth.corrupt[i]; if (!c) return;
  const blob = new Blob([c.raw], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MASTER_TESTBOOK_DAMAGED_${c.label}_${Date.now()}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  c.dismissed = true; DataSafety.paint();
}
function showRestorePreview(payload, label) {
  const v = validateBackupPayload(payload);
  const box = document.getElementById('bkRestore'); if (!box) return;
  if (!v.ok) { PendingRestore = null; box.innerHTML = `<div class="bk-status bad"><b>❌ यह backup इस्तेमाल नहीं हो सकता</b>${v.errors.map(e => `<span>${escapeHtml(e)}</span>`).join('')}</div>`; return; }
  PendingRestore = payload;
  const missing = ['userState', 'attemptHistory', 'resultHistory', 'reviewState', 'studySettings'].filter(k => payload[k] === undefined);
  box.innerHTML = `<div class="bk-status warn"><b>${escapeHtml(label)}</b><span>${v.exportedAt ? 'बना: ' + fmtWhen(v.exportedAt) + ' · ' : ''}${countsLine(v.counts)}</span>
    <span>अभी का data इससे <b>बदल जाएगा</b>। बदलने से पहले अभी वाले data का अपने-आप backup बनेगा।</span>${missing.length ? `<span>इस backup में ${missing.length} हिस्से नहीं हैं — वे अभी जैसे हैं वैसे रहेंगे।</span>` : ''}
    <div class="bk-actions"><button type="button" class="btn-nav" onclick="PendingRestore=null;document.getElementById('bkRestore').innerHTML=''">रद्द</button><button type="button" class="btn-nav primary" onclick="confirmRestore()">हाँ, वापस लाएँ</button></div></div>`;
}
async function restoreFromFile(file) {
  if (!file) return;
  let payload = null;
  try { payload = JSON.parse(await file.text()); } catch (_) { const box = document.getElementById('bkRestore'); if (box) box.innerHTML = `<div class="bk-status bad"><b>❌ File पढ़ी नहीं जा सकी</b><span>यह सही JSON backup file नहीं है।</span></div>`; return; }
  showRestorePreview(payload, '📄 ' + file.name);
}
async function restoreFromSlot(slot) {
  const raw = await AppStorage.getRaw(AUTOSNAP_KEY(slot));
  let payload = null; try { payload = JSON.parse(raw || 'null'); } catch (_) {}
  showRestorePreview(payload, '🕒 अपने-आप बना backup');
}
async function confirmRestore() {
  const p = PendingRestore; if (!p) return;
  if (ActiveTestSession?.sessionStatus === 'ACTIVE') { openCustomToast('पहले चल रहा टेस्ट submit करें।'); return; }
  try {
    await DataSafety.snapshot('Restore से पहले');
    const map = { [STORAGE_KEY]: JSON.stringify(p.modules) };
    if (p.userState) map[USER_KEY] = JSON.stringify(p.userState);
    if (p.importHistory) map[IMPORT_HISTORY_KEY] = JSON.stringify(p.importHistory);
    if (p.attemptHistory) map[ATTEMPT_HISTORY_KEY] = JSON.stringify(p.attemptHistory);
    if (p.resultHistory) map[RESULT_HISTORY_KEY] = JSON.stringify(p.resultHistory);
    if (p.builderTemplates) map[BUILDER_TEMPLATE_KEY] = JSON.stringify(p.builderTemplates);
    if (p.reviewState) map[REVIEW_STATE_KEY] = JSON.stringify(p.reviewState);
    if (p.studySettings) map[STUDY_SETTINGS_KEY] = JSON.stringify(p.studySettings);
    await StorageWriteQueue.flush();
    await AppStorage.commitMany(map);
    PendingRestore = null;
    location.reload();
  } catch (e) {
    const box = document.getElementById('bkRestore'); if (box) box.innerHTML = `<div class="bk-status bad"><b>❌ Restore नहीं हुआ</b><span>${escapeHtml(e.message || e)}। अभी का data जैसा था वैसा है।</span></div>`;
  }
}

/* ---------- safe delete (one place for every delete) ---------- */
async function deleteOwnedQuestions(ids) {
  const workspace = WorkspaceManager.requireActive();
  const selected = new Set(ids.map(x => String(x || '').trim()).filter(Boolean));
  if (!selected.size) { openCustomToast('पहले questions select करें.'); return false; }
  const owned = new Set();
  for (const mod of (AppModules || [])) {
    if (mod?.workspaceId !== workspace.id || mod?.workspaceType !== workspace.type) continue;
    for (const g of (mod.groups || [])) for (const q of (g.questions || [])) { const id = String(q?.canonicalQId || '').trim(); if (id && selected.has(id)) owned.add(id); }
  }
  if (!owned.size) { openCustomToast('चयनित प्रश्न active workspace में नहीं हैं; कोई बदलाव नहीं किया गया।'); return false; }
  if (owned.size !== selected.size) { openCustomToast('कुछ चयनित प्रश्न active workspace के स्वामित्व में नहीं हैं; सुरक्षा के लिए पूरी deletion रोक दी गई।'); return false; }
  if (!confirm(`${owned.size} question(s) को active workspace (${workspace.name}) से delete करना है?\n\nDelete से पहले अपने-आप backup बनेगा।`)) return false;
  try {
    const next = AppModules.map(mod => {
      if (mod?.workspaceId !== workspace.id || mod?.workspaceType !== workspace.type) return mod;
      return { ...mod, groups: (mod.groups || []).map(g => ({ ...g, questions: (g.questions || []).filter(q => !owned.has(String(q?.canonicalQId || ''))) })).filter(g => (g.questions || []).length) };
    }).filter(mod => mod?.workspaceId !== workspace.id || mod?.workspaceType !== workspace.type || (mod.groups || []).length);
    await DataCore.commit(next, { reason: `Delete ${owned.size}`, snapshot: `Delete से पहले (${owned.size} सवाल)`, allowNewIssues: true });
    openDataControlModal();
    return true;
  } catch (e) {
    openCustomToast('Delete नहीं हुआ; पुराना data वैसा ही है।');
    return false;
  }
}
async function deleteSelectedQuestions() { return deleteOwnedQuestions(Array.from(document.querySelectorAll('.dc-check:checked'), x => x.value)); }
async function deleteQuestionDNA(canonicalQId) { return deleteOwnedQuestions([canonicalQId]); }

/* ---------- undo last import of this workspace ---------- */
async function undoLastImportUI() {
  const ws = WorkspaceManager.current();
  const history = getImportHistory();
  const entry = history.find(h => (h.workspaceId ? h.workspaceId === ws.id : !!AppModules.find(m => m.moduleId === h.moduleId && WorkspaceManager.matches(m))));
  if (!entry) return openCustomToast('इस workspace में undo करने लायक कोई import नहीं है।');
  if (entry.beforeModule === undefined) return openCustomToast('यह पुराना import है — इसे undo नहीं कर सकते। "Backup और Restore" से पुराना backup वापस ला सकते हैं।');
  if (!confirm(`आख़िरी import वापस लें?\n\nFile: ${entry.sourceFile}\nTopic: ${entry.topicTitle}\n\n${entry.beforeModule ? 'Topic import से पहले जैसा हो जाएगा।' : 'यह topic हट जाएगा (यह इसी import से बना था)।'}`)) return;
  try {
    const idx = AppModules.findIndex(m => m.moduleId === entry.moduleId && WorkspaceManager.matches(m));
    const next = AppModules.slice();
    if (entry.beforeModule) { if (idx >= 0) next[idx] = entry.beforeModule; else next.push(entry.beforeModule); } else if (idx >= 0) next.splice(idx, 1);
    const nextHistory = history.filter(h => h !== entry);
    await DataCore.commit(next, { reason: 'Undo import', snapshot: 'Undo से पहले: ' + entry.topicTitle, importHistory: nextHistory, allowNewIssues: true });
    openCustomToast('✅ Import वापस ले लिया गया।');
  } catch (e) {
    openCustomToast('❌ Undo नहीं हुआ: ' + escapeHtml(e.message || e));
  }
}

/* ---------- mapping app data → server rows ---------- */
function srvYear(v) { const n = parseInt(String(v || '').trim(), 10); return n >= 1950 && n <= 2100 ? n : null; }
function srvValidExamId(id) { return /^[a-z0-9][a-z0-9-]{1,80}$/.test(String(id || '')); }
function srvInList(ids) { return '(' + ids.map(id => encodeURIComponent('"' + String(id).replace(/["\\]/g, '\\$&') + '"')).join(',') + ')'; }
function srvExamRow(id, nameHint) {
  const p = UniversalExamRegistry.registry.get(id) || {}, k = UniversalExamRegistry.knownProfiles[id] || {};
  return { id, name: String(p.examName || k.name || nameHint || id).slice(0, 120), board: p.examBoard || k.board || null, category: p.category || k.category || null, marking: p.markingScheme || k.marking || null };
}
function srvTopicRow(mod) {
  return { id: mod.moduleId, workspace: 'competitive', subject: String(mod.subject || 'general'), chapter: String(mod.chapter || 'General'), title: String(mod.topicTitle || mod.moduleId), exam_id: srvValidExamId(mod.examId) ? mod.examId : null, year: srvYear(mod.examYear) };
}
function srvQuestionRow(q, mod) {
  const m = q.metadata || {}, problems = [];
  const subjective = String(m.questionFormat || q.questionFormat || '').toUpperCase() === 'SUBJECTIVE';
  const answer = String(q.answer || '').toUpperCase().trim();
  if (!(q.QUESTION_EN || q.QUESTION_HI || '').trim()) problems.push('सवाल का text नहीं');
  if (!subjective) {
    if (!/^[A-D]$/.test(answer)) problems.push(`उत्तर "${String(q.answer || '').slice(0, 8)}" A–D नहीं`);
    if (!Array.isArray(q.options) || q.options.length !== 4 || q.options.some(o => !(o?.en || o?.hi))) problems.push('चारों options नहीं');
  }
  const st = pyqStatusOf(q);
  const diff = m.difficultySource === 'DEFAULT' ? null : (['EASY', 'MODERATE', 'HARD'].includes(String(m.difficulty || '').toUpperCase()) ? String(m.difficulty).toUpperCase() : null);
  const row = {
    id: String(q.canonicalQId), topic_id: mod.moduleId, workspace: 'competitive',
    exam_id: srvValidExamId(m.examId) ? m.examId : (srvValidExamId(mod.examId) ? mod.examId : null),
    year: srvYear(m.year || mod.examYear), shift: String(m.shift || '').trim() || null,
    subject: String(m.subject || mod.subject || 'general'), chapter: String(m.chapter || mod.chapter || 'General'), topic: String(m.topic || mod.topicTitle || mod.moduleId),
    subtopic: m.subtopic ? String(m.subtopic) : null, question_no: Number(q.originalQNo) > 0 ? Math.floor(Number(q.originalQNo)) : null,
    format: subjective ? 'SUBJECTIVE' : 'MCQ', question_en: String(q.QUESTION_EN || '').trim() || null, question_hi: String(q.QUESTION_HI || '').trim() || null,
    options: subjective ? [] : (q.options || []).map(o => ({ letter: String(o.letter || '').toUpperCase(), en: String(o.en || ''), hi: String(o.hi || '') })),
    answer: subjective ? null : (/^[A-D]$/.test(answer) ? answer : null),
    explanation_en: String(q.EXPLANATION || '').trim() || null, explanation_hi: String(q.EXPLANATION_HI || '').trim() || null,
    source_type: st === 'PYQ' ? 'PYQ' : st === 'NOT_PYQ' ? 'PRACTICE' : null, difficulty: diff, is_active: true
  };
  // Hash of everything we send: any change (text, answer, PYQ mark…) makes it "changed".
  row.content_hash = 'v1-' + importHash(JSON.stringify(row));
  return { row, problems };
}

/* ---------- plan: what will be sent ---------- */
async function srvBuildPlan(moduleIds) {
  const plan = { topics: [], examRows: new Map(), totals: { new: 0, changed: 0, same: 0, skipped: 0, conflict: 0, serverOnly: 0 }, builtAt: Date.now() };
  for (const id of moduleIds) {
    const mod = getWorkspaceModule(id); if (!mod) continue;
    ServerState.progress = `जाँच: ${mod.topicTitle || mod.moduleId}`; srvPaint();
    const rows = [], skipped = [];
    (mod.groups || []).flatMap(g => g.questions || []).forEach(q => { const r = srvQuestionRow(q, mod); if (r.problems.length) skipped.push({ no: q.originalQNo, id: String(q.canonicalQId), why: r.problems.join(', ') }); else rows.push(r.row); });
    const server = await Server.select('questions', `select=id,content_hash,is_active&topic_id=eq.${encodeURIComponent(mod.moduleId)}`);
    const sMap = new Map((server || []).map(x => [x.id, x]));
    const unknown = rows.map(r => r.id).filter(i => !sMap.has(i)), elsewhere = new Map();
    for (let i = 0; i < unknown.length; i += 60) {
      const res = await Server.select('questions', `select=id,topic_id&id=in.${srvInList(unknown.slice(i, i + 60))}`);
      (res || []).forEach(x => { if (x.topic_id !== mod.moduleId) elsewhere.set(x.id, x.topic_id); });
    }
    const conflicts = rows.filter(r => elsewhere.has(r.id)).map(r => ({ id: r.id, topic: elsewhere.get(r.id) }));
    const send = rows.filter(r => !elsewhere.has(r.id));
    const fresh = send.filter(r => !sMap.has(r.id));
    const changed = send.filter(r => sMap.has(r.id) && (sMap.get(r.id).content_hash !== r.content_hash || !sMap.get(r.id).is_active));
    const localIds = new Set([...rows.map(r => r.id), ...skipped.map(s => s.id)]);
    const serverOnly = (server || []).filter(x => x.is_active && !localIds.has(x.id)).map(x => x.id);
    const topicRow = srvTopicRow(mod);
    [topicRow.exam_id, ...send.map(r => r.exam_id)].filter(Boolean).forEach(e => { if (!plan.examRows.has(e)) plan.examRows.set(e, srvExamRow(e, (mod.groups || []).flatMap(g => g.questions || []).find(q => q.metadata?.examId === e)?.metadata?.exam)); });
    const t = { moduleId: mod.moduleId, title: mod.topicTitle || mod.moduleId, topicRow, toSend: [...fresh, ...changed], counts: { new: fresh.length, changed: changed.length, same: send.length - fresh.length - changed.length, skipped: skipped.length, conflict: conflicts.length, serverOnly: serverOnly.length }, skipped, conflicts, serverOnly };
    Object.keys(plan.totals).forEach(k => { plan.totals[k] += t.counts[k]; });
    plan.topics.push(t);
  }
  ServerState.progress = '';
  return plan;
}

/* ---------- run the plan ---------- */
async function srvRunPlan(plan, hideServerOnly) {
  const batchId = `SYNC-${Date.now()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
  const step = t => { ServerState.progress = t; srvPaint(); };
  step('Exams भेज रहे हैं…');
  await Server.upsert('exams', [...plan.examRows.values()], 'id');
  step('Topics भेज रहे हैं…');
  await Server.upsert('topics', plan.topics.map(t => t.topicRow), 'id');
  const sent = plan.topics.reduce((n, t) => n + t.toSend.length, 0);
  await Server.upsert('import_batches', [{ id: batchId, file_name: 'ऐप से upload', topic_id: plan.topics.length === 1 ? plan.topics[0].moduleId : null, added: plan.totals.new, changed: plan.totals.changed, unchanged: plan.totals.same, removed: hideServerOnly ? plan.totals.serverOnly : 0 }], 'id');
  let done = 0;
  for (const t of plan.topics) {
    for (let i = 0; i < t.toSend.length; i += 200) {
      const chunk = t.toSend.slice(i, i + 200).map(r => ({ ...r, import_batch_id: batchId }));
      await Server.upsert('questions', chunk, 'id');
      done += chunk.length; step(`सवाल भेज रहे हैं… ${done} / ${sent}`);
    }
    if (hideServerOnly && t.serverOnly.length) {
      for (let i = 0; i < t.serverOnly.length; i += 60) await Server.patch('questions', `id=in.${srvInList(t.serverOnly.slice(i, i + 60))}`, { is_active: false });
    }
    ServerState.syncInfo[t.moduleId] = { at: new Date().toISOString(), sent: t.toSend.length, total: t.counts.new + t.counts.changed + t.counts.same };
  }
  try { await AppStorage.setRawDirect(SERVER_SYNC_KEY, JSON.stringify(ServerState.syncInfo)); } catch (_) {}
  ServerState.progress = '';
  return { batchId, sent, hidden: hideServerOnly ? plan.totals.serverOnly : 0 };
}

/* ---------- content: questions from the server ---------- */
async function cloudPullAll(table, select, order) {

    out.push(...(rows || []));

  }

}
function cloudTargetWorkspace() { const w = WorkspaceManager.current(); return w.type === 'COMPETITIVE' ? w : WorkspaceManager.DEFAULT; }

    canonicalQId: r.id, subject: r.subject, chapter: r.chapter, topic: r.topic, subtopic: r.subtopic || 'General', examId: r.exam_id || '', exam: examName || r.exam_id || '',
    year: r.year ? String(r.year) : '', shift: r.shift || '', difficulty: r.difficulty || 'MODERATE', difficultySource: r.difficulty ? 'SERVER' : 'DEFAULT',
    questionFormat: r.format === 'SUBJECTIVE' ? 'SUBJECTIVE' : 'MCQ', status: 'SERVER', workspaceId: ws.id, workspaceType: ws.type
  };
  if (st) meta.sourceType = st;
  return {
    canonicalQId: r.id, originalQNo: r.question_no || idx + 1, QUESTION_EN: r.question_en || '', QUESTION_HI: r.question_hi || '',
    options: Array.isArray(r.options) ? r.options.map(o => ({ letter: String(o.letter || '').toUpperCase(), en: o.en || '', hi: o.hi || o.en || '' })) : [],
    answer: r.answer || '', EXPLANATION: r.explanation_en || r.explanation_hi || '', EXPLANATION_HI: r.explanation_hi || '',
    hints: [r.explanation_en || r.explanation_hi || ''].filter(Boolean), examInfo: examName || '', year: meta.year, paperDate: meta.shift,
    metadata: meta, workspaceId: ws.id, workspaceType: ws.type, contentHash: r.content_hash || '', importState: 'READY', version: 'server'

}
async function cloudPullContent() {
  const ws = cloudTargetWorkspace();
  const exams = await cloudPullAll('exams', 'id,name', 'id');
  const topics = await cloudPullAll('topics', 'id,subject,chapter,title,exam_id,year', 'id');
  const rows = await cloudPullAll('questions', 'id,topic_id,exam_id,year,shift,subject,chapter,topic,subtopic,question_no,format,question_en,question_hi,options,answer,explanation_en,explanation_hi,source_type,difficulty,content_hash', 'topic_id,question_no,id');
  const examName = new Map(exams.map(e => [e.id, e.name]));
  const byTopic = new Map(); rows.forEach(r => { if (!byTopic.has(r.topic_id)) byTopic.set(r.topic_id, []); byTopic.get(r.topic_id).push(r); });
  const modules = [];
  topics.forEach(t => {
    const list = byTopic.get(t.id) || []; if (!list.length) return;
    const qs = list.map((r, i) => cloudQuestionFromRow(r, examName.get(r.exam_id), ws, i));
    const groups = [];
    for (let i = 0; i < qs.length; i += 20) { const c = qs.slice(i, i + 20), n = String(i / 20 + 1).padStart(2, '0'); groups.push({ groupId: `${t.id}-g${n}`, title: `G-${n}`, description: `${c.length} Questions • Q${c[0].originalQNo}–Q${c[c.length - 1].originalQNo}`, questions: c }); }
    const subj = String(t.subject || 'general');
    const mod = { workspaceId: ws.id, workspaceType: ws.type, moduleId: t.id, source: 'server', subject: subj,
      subjectTitle: subj === 'maths' ? '📐 Mathematics' : subj === 'science' ? '🔬 General Science' : subj === 'reasoning' ? '🧠 Reasoning' : '📘 ' + subjectDisplayName(subj),
      topic: slugify(t.title), topicTitle: t.title, chapter: t.chapter, examId: t.exam_id || undefined, examYear: t.year ? String(t.year) : undefined,
      testType: 'class-test', testTypeTitle: 'Class Test', groups };
    WorkspaceManager.stampM(mod, ws); modules.push(mod);
  });
  const serverIds = new Set(modules.map(m => m.moduleId));
  const keep = AppModules.filter(m => !(m.workspaceId === ws.id && (serverIds.has(m.moduleId) || m.source === 'server')));
  const before = AppModules;
  const next = [...keep, ...modules];
  const changed = JSON.stringify(before.filter(m => m.workspaceId === ws.id && m.source === 'server').map(m => [m.moduleId, m.groups.map(g => g.questions.map(q => q.contentHash))])) !== JSON.stringify(modules.map(m => [m.moduleId, m.groups.map(g => g.questions.map(q => q.contentHash))]));
  if (changed) {
    await DataCore.commit(next, { reason: 'Server से सवाल', snapshot: 'Server से सवाल लाने से पहले', allowNewIssues: true });
  }
  CloudState.serverQuestions = rows.length; CloudState.lastContentAt = new Date().toISOString();

}

/* ---------- progress: attempts, tests, bookmarks, goal ---------- */
function cloudAttemptId(a) { return a.clientId || `${a.cid}@${a.ts}`; }
async function cloudExisting(table, ids) {
  const found = new Set();
  for (let i = 0; i < ids.length; i += 60) { const res = await Server.select(table, `select=id&id=in.${srvInList(ids.slice(i, i + 60))}`); (res || []).forEach(x => found.add(x.id)); }
  return found;
}
async function cloudInsertIgnore(table, rows) {
  if (!rows.length) return;
  await Server.ensureFresh();
  for (let i = 0; i < rows.length; i += 300) await Server.req(`/rest/v1/${table}?on_conflict=user_id,client_id`, { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' }, body: rows.slice(i, i + 300) });
}
async function cloudSyncProgress() {

  const known = await cloudExisting('questions', [...new Set(pending.map(a => a.cid))]);
  const send = [];
  pending.forEach(a => {
    if (!known.has(a.cid)) { a.syncSkip = true; return; }
    send.push({ client_id: cloudAttemptId(a), question_id: a.cid, chosen: String(a.answer).toUpperCase(), is_correct: !!a.correct, seconds: Number.isFinite(Number(a.sec)) && a.sec !== null ? Math.max(0, Math.min(3600, Math.round(a.sec))) : null, mode: ['practice', 'test', 'revision'].includes(a.mode) ? a.mode : 'practice', session_id: a.resultId || null, answered_at: a.ts });
  });
  await cloudInsertIgnore('attempts', send);
  const sentIds = new Set(send.map(r => r.client_id));
  AttemptHistory.forEach(a => { if (sentIds.has(cloudAttemptId(a))) { a.synced = true; a.uid = uid; a.clientId = cloudAttemptId(a); } });
  // tests up (the whole local record rides along so another phone can show it fully)
  const examIds = new Set((await cloudPullAll('exams', 'id', 'id')).map(e => e.id));
  const rPending = ResultHistory.filter(r => !r.synced && (!r.uid || r.uid === uid));
  await cloudInsertIgnore('results', rPending.map(r => ({ client_id: r.id, title: [r.topicTitle, r.groupTitle].filter(Boolean).join(' · ').slice(0, 200) || 'Test', exam_id: examIds.has(r.examId) ? r.examId : null, year: srvYear(r.examYear), question_ids: (r.questionIds || []).map(String), answers: { local: r }, correct: Math.max(0, r.correct | 0), wrong: Math.max(0, r.wrong | 0), skipped: Math.max(0, r.unattempted | 0), score: Number.isFinite(Number(r.score)) ? Number(r.score) : null, duration_seconds: Number.isFinite(Number(r.timeUsedSec)) ? Math.max(0, Math.round(r.timeUsedSec)) : null, submitted_at: r.ts })));
  rPending.forEach(r => { r.synced = true; r.uid = uid; });
  // attempts + tests down (a new phone gets its history back)
  const have = new Set(AttemptHistory.map(cloudAttemptId));
  const qById = id => IndexEngine.registry.get(id);
  const srvAttempts = await Server.select('attempts', 'select=client_id,question_id,chosen,is_correct,seconds,mode,session_id,answered_at&order=answered_at.desc&limit=5000');
  const added = [];

    if (have.has(x.client_id)) return;
    const q = qById(x.question_id), m = q?.metadata || {}, mod = AppModules.find(md => (md.groups || []).some(g => (g.questions || []).includes(q)));
    const ts = new Date(x.answered_at).toISOString();
    added.push({ v: 1, ts, day: sjLocalDay(new Date(ts)), mode: x.mode, ws: ws.id, moduleId: mod?.moduleId || '', cid: x.question_id, qno: q?.originalQNo ?? null, subject: m.subject || '', chapter: m.chapter || '', topic: m.topic || '', subtopic: m.subtopic || '', type: m.theoryOrNumerical || '', difficulty: m.difficulty || '', examId: m.examId || '', year: m.year || '', answer: x.chosen || '', key: q?.answer || '', correct: !!x.is_correct, sec: x.seconds, resultId: x.session_id || undefined, clientId: x.client_id, synced: true, uid });
  });
  if (added.length) { AttemptHistory.push(...added); AttemptHistory.sort((a, b) => String(a.ts).localeCompare(String(b.ts))); if (AttemptHistory.length > ATTEMPT_HISTORY_CAP) AttemptHistory.splice(0, AttemptHistory.length - ATTEMPT_HISTORY_CAP); }
  const haveR = new Set(ResultHistory.map(r => r.id));

  let addedR = 0;
  (srvResults || []).forEach(x => { const r = x.answers?.local; if (!r || haveR.has(x.client_id) || r.id !== x.client_id) return; ResultHistory.push({ ...r, ws: ws.id, synced: true, uid }); addedR++; });

  // bookmarks: first time on a phone = merge both ways; afterwards this phone decides
  const srvB = await Server.select('bookmarks', 'select=question_id');

  if (upB.length) { await Server.ensureFresh(); await Server.req('/rest/v1/bookmarks?on_conflict=user_id,question_id', { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' }, body: upB }); }

}

    CloudState.busy = true; cloudPaint();
    try {
      await Server.ensureFresh();
      const uid = ServerState.session.user_id;
      if (CloudState.isAdmin === null || CloudState.userId !== uid) CloudState.isAdmin = await Server.checkAdmin();
      let content = null;

      const prog = await cloudSyncProgress();
      CloudState.userId = uid; CloudState.email = ServerState.session.email || CloudState.email; CloudState.lastSyncAt = new Date().toISOString();
      CloudState.msg = `✓ Sync हो गया${content?.changed ? ` · ${content.questions} सवाल server से आए` : ''}${prog.up ? ` · ${prog.up} जवाब भेजे` : ''}${prog.down ? ` · ${prog.down} पुराने जवाब वापस आए` : ''}`; CloudState.msgKind = 'good';
      await cloudSaveState();

/* Custom pipeline: rows after applying every filter up to and including `stage`. */
const SB_STAGES = ['year', 'subject', 'topic', 'subtopic', 'type', 'history', 'pick'];
function sbCustomRows(stage) {
  const upto = SB_STAGES.indexOf(stage);
  let rows = sbAll().filter(r => r.examId === SB.examId && r.year === SB.year);
  if (upto >= 1) rows = rows.filter(r => !SB.exSubject.has(r.subject));
  if (upto >= 2) rows = rows.filter(r => !SB.exTopic.has(sbTopicKey(r)));
  if (upto >= 3) rows = rows.filter(r => !SB.exSubtopic.has(sbSubKey(r)));
  if (upto >= 4) rows = rows.filter(r => !SB.exType.has(sbTypeOf(r)) && !SB.exDiff.has(sbDiffOf(r)));
  if (upto >= 5 && SB.hist === 'unattempted') { const a = sbAttemptedIds(); rows = rows.filter(r => !a.has(r.id)); }
  if (upto >= 5 && SB.hist === 'wrong') { const w = sbWrongIds(); rows = rows.filter(r => w.has(r.id)); }
  if (upto >= 5 && SB.hist === 'bookmarked') { const bm = bookmarkedIds(); rows = rows.filter(r => bm.has(r.id)); }
  if (upto >= 6 && SB.pick === 'pick') rows = rows.filter(r => SB.picked.has(r.id));

  if(!/math|maths|mathematics|quantitative|arithmetic/.test(s)&&!/number system|percentage|profit|loss|simple interest|compound interest|ratio|average|geometry|mensuration|trigonometry|algebra|time and work|speed|distance|mixture|partnership|probability|statistics|data interpretation/.test(c))return String(chapter||'General');

const LearningHistory = {
  baseRecord(q, mod, mode) {

    saveAttemptHistory();
  },
  recordPractice(q, mod, letter, sec, mode) {

    rec.answer = String(letter || ''); rec.key = String(q.answer || '');

    const resultId = 'R-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();

    const records = [];

function sjModuleQuestionCount(m) {
  return (m?.groups || []).reduce((a, g) => a + ((g.questions || []).length), 0);
}
function sjCollectDashboardData() {
  const workspace = WorkspaceManager.current();
  const modules = WorkspaceManager.filterModules(AppModules || []).filter(m => sjModuleQuestionCount(m) > 0);
  const subjects = new Map();
  let totalQuestions = 0;
  modules.forEach(m => {
    const n = sjModuleQuestionCount(m);
    totalQuestions += n;
    const key = String(m.subject || 'other');
    const s = subjects.get(key) || { key, title: subjectDisplayName(key), questions: 0, topics: 0 };
    s.questions += n; s.topics += 1; subjects.set(key, s);
  });

  const today = sjLocalDay();
  const attemptsToday = LearningHistory.attemptsForWorkspace(workspace.id).filter(a => a.day === today);
  const results = LearningHistory.resultsForWorkspace(workspace.id);
  const resultsToday = results.filter(r => r.day === today);
  const practiceToday = attemptsToday.filter(a => a.mode === 'practice').length;
  const answered = attemptsToday.length;
  const correct = attemptsToday.filter(a => a.correct === true).length;

  let resume = null;
  const stack = [...(Array.isArray(AppRouteStack) ? AppRouteStack : [])].reverse();
  for (const r of stack) {
    if (r?.page === 'practice' && r.params?.moduleId && !Array.isArray(r.params?.customQuestions)) {
      const m = getWorkspaceModule(r.params.moduleId);
      if (m && sjModuleQuestionCount(m) > 0) {
        const qIndex = Math.max(0, Math.min(Number(r.params.qIndex) || 0, sjModuleQuestionCount(m) - 1));
        resume = { module: m, qIndex };
        break;
      }
    }
  }

  const scopedMistakes = (competitiveEnabledGuard() ? getScopedCompetitiveMistakes() : (UserState.mistakeBook || [])) || [];
  const realMistakes = scopedMistakes.filter(m => !sjIsSeedMistake(m));
  const starterMistakes = scopedMistakes.length - realMistakes.length;
  const workspaceMistakes = (UserState.mistakeBook || []).filter(m => !sjIsSeedMistake(m) && getWorkspaceModule(m.moduleId));
  const otherExamMistakes = Math.max(0, workspaceMistakes.length - realMistakes.length);
  const topicMistakes = new Map();
  realMistakes.forEach(m => {
    const key = String(m.moduleId || '') + '␟' + String(m.topicTitle || 'Topic');
    const t = topicMistakes.get(key) || { moduleId: m.moduleId, topic: String(m.topicTitle || 'Topic'), count: 0 };
    t.count++; topicMistakes.set(key, t);
  });
  const weakTopics = [...topicMistakes.values()].sort((a, b) => b.count - a.count || a.topic.localeCompare(b.topic));

  const mastery = Object.entries(UserState.masteryMap || {}).map(([topic, d]) => ({
    topic, score: Number(d?.score) || 0, level: String(d?.level || 'learning'),
    starter: Object.prototype.hasOwnProperty.call(SJ_SEED_MASTERY, topic) && Number(d?.score) === SJ_SEED_MASTERY[topic]
  }));

  const examProfile = UniversalExamRegistry.registry.get(UserState.selectedExam) || null;
  const examName = examProfile?.examName || UniversalExamRegistry.knownProfiles[UserState.selectedExam]?.name || '';
  const imports = (typeof getImportHistory === 'function' ? getImportHistory() : []).slice(0, 5);

  return {
    workspace, modules, subjects: [...subjects.values()].sort((a, b) => b.questions - a.questions),
    totalQuestions, results, resultsToday, practiceToday,
    answered, correct, accuracy: answered > 0 ? Math.round((correct / answered) * 100) : null,
    resume, realMistakes, starterMistakes, otherExamMistakes, weakTopics, mastery, examName,
    examYear: String(UserState.selectedYear || ''), imports
  };
}
function sjBarRows(rows, max, onClickFor) {
  return rows.map(r => {
    const pct = max > 0 ? Math.max(4, Math.round((r.value / max) * 100)) : 0;
    const call = onClickFor ? onClickFor(r) : '';
    const tag = call ? 'button' : 'div';
    return `<${tag} class="sj-bar-row" ${call ? `type="button" onclick="${call}"` : ''} title="${escapeHtml(r.label)}: ${escapeHtml(r.valueLabel)}">
      <span class="sj-bar-label">${escapeHtml(r.label)}</span>
      <span class="sj-bar-track" aria-hidden="true"><span class="sj-bar-fill" style="width:${pct}%"></span></span>
      <span class="sj-bar-value">${escapeHtml(r.valueLabel)}</span>
    </${tag}>`;
  }).join('');
}

/* V2.3.7: show how the eligible question count was reached, step by step. Read-only. */
function nbCountFunnel() {
  const S = NativeBuilderState;
  const stored = WorkspaceManager.filterModules(AppModules || []).filter(m => m.workspaceType !== 'BOARD').reduce((n, m) => n + sjModuleQuestionCount(m), 0);
  let rows = nbSourceRows();
  const steps = [{ label: 'In bank', n: stored }];
  if (rows.length !== stored) steps.push({ label: 'Usable', n: rows.length, why: `${stored - rows.length} not usable: duplicate ID, missing options/answer, or missing subject/topic.` });
  if (S.examId || S.year) {
    rows = rows.filter(r => (!S.examId || r.examId === S.examId) && (!S.year || r.year === S.year));
    steps.push({ label: 'Exam/Year', n: rows.length });
  }
  if (S.difficulty) { rows = rows.filter(r => r.difficulty === S.difficulty); steps.push({ label: 'Difficulty', n: rows.length }); }
  if (S.mode === 'pyq') { rows = rows.filter(nbSafePYQ); steps.push({ label: 'Verified PYQ', n: rows.length }); }
  const term = String(S.search || '').trim().toLowerCase();
  if (term) {
    rows = rows.filter(r => [r.subject, r.chapter, r.topic, r.q.QUESTION_EN, r.q.QUESTION_HI, r.id].some(x => String(x || '').toLowerCase().includes(term)));
    steps.push({ label: 'Search', n: rows.length });
  }
  if (S.subjects.size || S.topics.size) steps.push({ label: S.topics.size ? 'Topic' : 'Subject', n: nbBuilderTypePool().length });
  if (S.questionTypes.size) steps.push({ label: 'Type', n: nbFilteredRows().length });
  return steps;
}
function nbRenderFunnel(v) {
  if (NativeBuilderState.tab !== 'selection' || NativeBuilderState.wizardStep < 1) return;
  const progress = v.querySelector('.nb-wizard-progress');
  if (!progress) return;
  const steps = nbCountFunnel();
  const el = document.createElement('div');
  el.className = 'nb-funnel';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-label', 'How the question count was reached');
  el.innerHTML = steps.map((s, i) => `${i ? '<span class="nb-funnel-sep" aria-hidden="true">→</span>' : ''}<span class="nb-funnel-chip ${i && s.n < steps[i - 1].n ? 'drop' : ''}">${escapeHtml(s.label)} <b>${s.n}</b></span>`).join('')
    + (steps.find(s => s.why) ? `<span class="nb-funnel-why">${escapeHtml(steps.find(s => s.why).why)}</span>` : '');
  progress.insertAdjacentElement('afterend', el);
}

/* 5.4 TAXONOMY EXPLORER */
let ActiveTaxonomyFilters = { subject: '', type: '', difficulty: '', length: '', examId: '' };

function setTaxonomyFilter(key, val) { ActiveTaxonomyFilters[key] = val; renderView(); }
function resetTaxonomyFilters() { ActiveTaxonomyFilters = { subject: '', type: '', difficulty: '', length: '', examId: '' }; renderView(); }
function startSinglePractice(canonicalQId) {
  const q = IndexEngine.registry.get(canonicalQId);
  if (!q) return;
  const visibleModules = CurriculumContext.isActive() ? CurriculumContext.filterModules(AppModules) : WorkspaceManager.filterModules(AppModules);
  let targetMod = visibleModules[0]; let targetIndex = 0;
  for (const m of visibleModules) {
    const all = m.groups.flatMap(g => g.questions);
    const idx = all.findIndex(item => item.canonicalQId === canonicalQId || item.originalQNo === q.originalQNo);
    if (idx >= 0) { targetMod = m; targetIndex = idx; break; }
  }
  navigate('practice', { moduleId: targetMod.moduleId, qIndex: targetIndex });
}
function launchFilteredDrill() {
  const filtered = CurriculumContext.isActive() ? CurriculumContext.query(ActiveTaxonomyFilters) : IndexEngine.query(ActiveTaxonomyFilters);
  if (!filtered.length) return;
  startSinglePractice(filtered[0].canonicalQId);
}

let PendingCbtSectionSwitch=null;
function cbtCurrentSectionLabel(){
  if(ActiveTestSession?.sessionContractVersion===1){
    const title=String(ActiveTestSession.topicTitle||'Custom Test').trim()||'Custom Test';
    const count=Array.isArray(ActiveTestSession.questions)?ActiveTestSession.questions.length:0;

function cbtAvailableSectionOptions(){
  const workspace=WorkspaceManager.current();
  const modules=WorkspaceManager.filterModules(AppModules||[]).filter(m=>m&&m.workspaceId===workspace.id&&m.workspaceType===workspace.type&&(m.groups||[]).some(g=>(g.questions||[]).length));
  const indexed=typeof nbSourceRows==='function'?nbSourceRows():[];
  const options=[],seenModules=new Set();
  const subjectName=(raw)=>{
    const clean=String(raw||'Subject').trim().replace(/^[^a-z0-9ऀ-ॿ]+/i,'').replace(/\s+/g,' ');
    const key=clean.toLowerCase();
    const aliases={'math':'Mathematics','maths':'Mathematics','mathematics':'Mathematics','science':'General Science','general science':'General Science','gs':'General Science','reasoning':'Reasoning Ability','reasoning ability':'Reasoning Ability'};
    return aliases[key]||clean||'Subject';
  };
  for(const mod of modules){
    const moduleId=String(mod.moduleId||'');if(!moduleId||seenModules.has(moduleId))continue;
    const rows=indexed.filter(r=>String(r.mod?.moduleId||r.moduleId||'')===moduleId);
    const rawSubject=String(rows[0]?.subject||mod.subject||mod.subjectTitle||'').trim();
    const subjectLabel=subjectName(rawSubject);
    const topic=String(mod.topicTitle||mod.topic||rows[0]?.topic||mod.chapter||'').trim();
    if(!subjectLabel||!topic)continue;
    seenModules.add(moduleId);
    options.push({value:'topic:'+moduleId,label:`${subjectLabel} · ${topic}`,type:'topic',id:moduleId,subjectLabel,topicLabel:topic});
  }
  return options.sort((a,b)=>a.subjectLabel.localeCompare(b.subjectLabel)||a.topicLabel.localeCompare(b.topicLabel)||a.value.localeCompare(b.value));
}
function requestCbtSectionSwitch(value){

  const target=cbtAvailableSectionOptions().find(x=>x.value===String(value));
  if(!target){openCustomToast('That section is no longer available in the active workspace.');renderView();return;}
  if(target.type==='topic'&&target.id===String(ActiveTestSession.moduleId)){renderView();return;}
  if(target.type==='subject'&&String(getWorkspaceModule(ActiveTestSession.moduleId)?.subject||'')===target.id){renderView();return;}

}
