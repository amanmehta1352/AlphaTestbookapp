function initTestSession(moduleId, groupId, qIndex = 0, recoveryState = null, launchContext = null) {
  if (launchContext?.curriculumContext && !(typeof CurriculumContext !== 'undefined' && CurriculumContext.isActive())) {
    // CurriculumContext.scope() currently invokes the callback without activating Route context;
    // recurse-with-same-context never terminates. The hub modules are already active-workspace filtered,
    // and getWorkspaceModule()/the workspace ownership guard below remain authoritative.
    launchContext = { ...launchContext, curriculumContext: false };
  }
  // Duplicate-start guard is limited to the existing host's single active CBT session.
  if (ActiveTestSession?.sessionStatus === 'ACTIVE' && !recoveryState) { openCustomToast('An assessment is already active. Submit or exit it before starting another.'); return; }
  const mod = getWorkspaceModule(moduleId);
  const group = mod?.groups?.find(g => g.groupId === groupId) || (!launchContext?.sessionSpec ? mod?.groups?.[0] : null);
  if (!mod || !group || !Array.isArray(group.questions) || !group.questions.length || (!launchContext?.sessionSpec && !competitiveEnabledGuard())) return;
  const effectiveWorkspace = (typeof CurriculumContext !== 'undefined' && CurriculumContext.isActive()) ? CurriculumContext.WORKSPACE : WorkspaceManager.current();
  if (!effectiveWorkspace?.id || mod.workspaceId !== effectiveWorkspace.id || mod.workspaceType !== effectiveWorkspace.type || mod.workspaceType === 'BOARD') return;
  const sessionSpec = launchContext?.sessionSpec || null;
  let sessionQuestions = group.questions;
  let sessionQuestionIds = group.questions.map(q=>String(q.canonicalQId||q.originalQNo));
  let sourceRefs = [];
  if (sessionSpec) {
    if (sessionSpec.version !== 1 || !Array.isArray(sessionSpec.questionIds) || !sessionSpec.questionIds.length || sessionSpec.questionIds.length > 500 || new Set(sessionSpec.questionIds.map(String)).size !== sessionSpec.questionIds.length || sessionSpec.fingerprint !== sessionSpec.questionIds.map(String).join('|')) { openCustomToast('Custom test rejected: invalid, duplicate or unfrozen question sequence.'); return; }
    const wanted = sessionSpec.questionIds.map(String); const available = new Map();
    if(!IndexEngine?.registry || typeof IndexEngine.registry.get!=='function') { openCustomToast('Custom test rejected: canonical Index registry is unavailable.'); return; }
    for (const m of WorkspaceManager.filterModules(AppModules||[])) {
      if (m.workspaceId !== effectiveWorkspace.id || m.workspaceType !== effectiveWorkspace.type || m.workspaceType === 'BOARD') continue;
      for (const g of (m.groups||[])) for (const q of (g.questions||[])) {
        const id = String(q.canonicalQId||''); if (!id) continue;
        if (!available.has(id)) available.set(id,{q,m,g}); else available.set(id,{ambiguous:true});
      }
    }
    for (const [id,entry] of available) if(!entry.ambiguous && IndexEngine.registry.get(id)!==entry.q) available.set(id,{ambiguous:true});
    const picked=[];

function formatCbtElapsedTime(seconds){const n=Math.max(0,Math.floor(Number(seconds)||0));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}

function confirmSubmitTest() {

  const answeredCount = Object.keys(ActiveTestSession.answers).length; const total = ActiveTestSession.questions.length;
  openModal('📤 Submit Assessment?', `<div style="font-size:14px; line-height:1.6; color:var(--text-main);">Are you ready to submit your test?<br><br>• <b>Answered:</b> ${answeredCount} / ${total}<br>• <b>Remaining:</b> ${total - answeredCount}</div><div style="display:flex; gap:10px; margin-top:20px;"><button onclick="closeModal()" class="btn-nav">Review More</button><button onclick="closeModal(); clearCbtRecoveryState(); submitTestSession();" class="btn-nav primary">Confirm & Submit</button></div>`);
}
function submitTestSession() {
  if (!ActiveTestSession || ActiveTestSession.submissionState==='COMMITTED') return;
  const session=ActiveTestSession; const isCustom=session.sessionContractVersion===1;
  if (TimerInterval) { clearInterval(TimerInterval); TimerInterval=null; }
  CbtExitGuard.disarm(); if(window.speechSynthesis?.cancel) window.speechSynthesis.cancel();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  let correct=0,wrong=0,unattempted=0;
  const sourceById=new Map((session.sourceRefs||[]).map(x=>[String(x.canonicalQId),x]));
  session.questions.forEach(q=>{
    const key=nbQuestionKey(q); const userAns=session.answers[key]; const source=sourceById.get(String(q.canonicalQId||''))||{};
    if(QuestionUI.getFormat(q)==='SUBJECTIVE'){unattempted++;return;}
    if(!userAns){unattempted++;return;}
    if(String(userAns).toUpperCase()===String(q.answer||'').toUpperCase()) correct++;
    else {
      wrong++;
      const sourceModule=source.moduleId||session.moduleId;
      const canonicalId=String(q.canonicalQId||q.originalQNo);
      const exists=(UserState.mistakeBook||[]).some(m=>m.moduleId===sourceModule&&(String(m.canonicalQId||'')===canonicalId||String(m.qId)===String(q.originalQNo)));
      if(!exists){
        UserState.mistakeBook.unshift({qId:q.originalQNo,canonicalQId:canonicalId,moduleId:sourceModule,sourceGroupId:source.groupId||session.groupId,topicTitle:source.topic||session.topicTitle,subtopic:q.metadata?.subtopic||source.topic||'General',subject:source.subject||q.metadata?.subject||'',chapter:source.chapter||q.metadata?.chapter||'',question:q.QUESTION_EN||q.QUESTION_HI,userAnswer:userAns,correctAnswer:q.answer,rootCause:'TEST_SIMULATION_ERROR',savedAt:'Just now'});
      }
    }
  });
  const total=session.questions.length;const accuracy=(correct+wrong)>0?Math.round((correct/(correct+wrong))*100):0;
  // The legacy single-module engine keeps its previous mastery calculation; mixed custom tests do not arbitrarily assign all results to the anchor topic.
  if(!isCustom){
    const topicSlug=session.moduleId.split('-')[1];const oldScore=UserState.masteryMap[topicSlug]?.score||0.5;
    const newScore=Math.min(1,Math.max(0,(oldScore*0.7)+((correct/Math.max(1,total))*0.3)));
    let level='learning';if(newScore<0.4)level='weak';else if(newScore<0.7)level='learning';else if(newScore<0.85)level='good';else level='mastered';
    UserState.masteryMap[topicSlug]={score:parseFloat(newScore.toFixed(2)),level};
  }
  session.submissionState='COMMITTED'; session.sessionStatus='SUBMITTED';
  const resultData={moduleId:session.moduleId,groupId:session.groupId,topicTitle:session.topicTitle,groupTitle:session.groupTitle,total,correct,wrong,unattempted,score:correct,accuracy,questions:session.questions.slice(),answers:{...session.answers},subjectiveState:{...(session.subjectiveState||{})},marked:{...(session.marked||{})},langMode:session.langMode,...(isCustom?{sessionContractVersion:1,questionIds:session.questionIds.slice(),questionSequenceFingerprint:session.questionSequenceFingerprint,sourceRefs:(session.sourceRefs||[]).map(x=>({...x}))}:{})};
  try { resultData.historyId = LearningHistory.recordTest(session, resultData); } catch (e) { console.warn('[History] test record failed', e); }
  clearCbtRecoveryState(); saveUserState(); ActiveTestSession=null; SubjectiveResultStateBuffer={}; navigate('result',{result:resultData});
}

      ? []
      : CurriculumContext.search(qTerm);
    const merged = [];

/* =========================================================================
   DATA CLEANUP (V2.9.0) — find and fix problems left by the old import
   engine (before V2.5.0): invented exam/year/shift, misread exam names,
   bad answer format, English text in Hindi options, answer always "A".

const CLEAN_INVENTED_EXAM = 'railway-official-pyq';
const CLEAN_KEEP_LAST = /none of (these|the above)|all of (these|the above)|both|neither|cannot be determined|इनमें से कोई नहीं|उपरोक्त सभी|इनमें से सभी|दोनों/i;

function cleanSubjective(q) { return String(q.metadata?.questionFormat || q.questionFormat || '').toUpperCase() === 'SUBJECTIVE'; }

// Stable, per-question shuffle (same result every time for the same id).
function cleanPermutation(id, n) {
  const idx = [...Array(n).keys()]; let h = (parseInt(importHash(id).slice(0, 6), 36) | 0) || 1;
  const next = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0); }; // xorshift32 — exact integer maths
  for (let i = 0; i < 3; i++) next();
  for (let i = n - 1; i > 0; i--) { const j = next() % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function cleanShuffled(q) {
  const opts = q.options || []; if (opts.length !== 4) return null;
  const movable = opts.map((o, i) => CLEAN_KEEP_LAST.test(`${o.en} ${o.hi}`) ? -1 : i).filter(i => i >= 0);
  if (movable.length < 2) return null;
  if (/\b(option|विकल्प)\s*\(?[a-d]\)?/i.test(q.EXPLANATION || '')) return null; // explanation names a letter — leave it
  const perm = cleanPermutation(String(q.canonicalQId), movable.length);
  const out = opts.map(o => ({ ...o }));
  movable.forEach((slot, k) => { const from = opts[movable[perm[k]]]; out[slot] = { ...from, letter: opts[slot].letter }; });
  const oldIdx = opts.findIndex(o => String(o.letter).toUpperCase() === String(q.answer).toUpperCase());
  const newIdx = out.findIndex(o => o.en === opts[oldIdx]?.en && o.hi === opts[oldIdx]?.hi);
  if (oldIdx < 0 || newIdx < 0) return null;
  return { options: out, answer: out[newIdx].letter };
}

function cleanApplyTo(mods, kind, extra = {}) {

    const examId = deriveExamIdStrict(examName);
    if (!examId) throw new Error('Exam का नाम लिखें।');
    if (!/^(19|20)\d{2}$/.test(String(year))) throw new Error('Year 4 अंकों में लिखें, जैसे 2023।');
    const name = examDisplayName(examId, examName);
    items.filter(it => it.moduleId === moduleId).forEach(it => { const hit = byId.get(it.id); if (!hit) return; const q = hit.q; q.examInfo = name; q.year = String(year); q.metadata.examId = examId; q.metadata.exam = name; q.metadata.year = String(year); touch(q); });

    if (m && (!m.examId || m.examId === CLEAN_INVENTED_EXAM || kind === 'examInvented')) { m.examId = examId; m.examYear = String(year); }
    return n;
  }
  items.forEach(it => {
    const hit = byId.get(it.id); if (!hit) return; const q = hit.q, m = hit.m;
    if (kind === 'answer') { q.answer = it.to; touch(q); }
    if (kind === 'hindi') { (q.options || []).forEach(o => { if (o.hi && o.en && o.hi !== o.en && !/[ऀ-ॿ]/.test(o.hi) && /[A-Za-z]{3,}/.test(o.hi)) o.hi = o.en; }); touch(q); }

function studioPickFile(input) {
  Studio.imp = { file: input.files?.[0] || null, analysis: null, plan: null, changedToDraft: false }; Studio.msg = '';
  studioPaint();
}
async function studioAnalyze() {
  const file = Studio.imp.file;
  if (!file) return studioSetMsg('पहले .txt file चुनें।', 'bad');
  const defaults = readImportDefaults();
  if (defaults.YEAR && !/^(19|20)\d{2}$/.test(defaults.YEAR)) return studioSetMsg(`ऊपर भरा Year "${defaults.YEAR}" सही नहीं (जैसे 2024 लिखें)`, 'bad');
  saveImportDefaults(defaults);
  Studio.busy = true; Studio.msg = ''; Studio.imp = { file, analysis: null, plan: null, changedToDraft: false }; Studio.progress = 'File जाँच रहे हैं…'; studioPaint();
  try {
    // 1st pass finds the topic; then that topic's server questions are loaded so IDs match exactly like a re-import.
    AppModules = [];
    let a = await ImportEngine.analyzeTxt(file, '', defaults);
    const serverRows = await studioTopicRows(a.moduleId, true);
    if (serverRows.length) {
      AppModules = [studioModuleFromRows(a.moduleId, serverRows)];
      a = await ImportEngine.analyzeTxt(file, '', defaults);
    }
    Studio.imp.analysis = a;
    if (a.commitReady) Studio.imp.plan = await studioBuildPlan(a, serverRows);
    Studio.msg = a.commitReady ? 'जाँच पूरी। नीचे देखें, फिर "Server पर भेजें" दबाएँ।' : 'File में गलतियाँ हैं — नीचे देखें।';
    Studio.msgKind = a.commitReady ? 'good' : 'bad';
  } catch (e) { Studio.msg = e.message; Studio.msgKind = 'bad'; }
  finally { AppModules = []; Studio.busy = false; Studio.progress = ''; studioPaint(); }
}
async function studioTopicRows(topicId, full) {
  const cols = full ? 'id,topic_id,exam_id,year,shift,subject,chapter,topic,subtopic,question_no,format,question_en,question_hi,options,answer,explanation_en,explanation_hi,source_type,difficulty,content_hash,status,is_active' : 'id,content_hash,status,is_active';
  const out = [];
  for (let offset = 0; ; offset += 1000) {
    const rows = await Server.select('questions', `select=${cols}&topic_id=eq.${encodeURIComponent(topicId)}&order=question_no,id&limit=1000&offset=${offset}`);
    out.push(...(rows || [])); if (!rows || rows.length < 1000) break;
  }
  return out;
}
function studioModuleFromRows(topicId, rows) {
  const ws = WorkspaceManager.current(), t = Studio.topics.find(x => x.id === topicId) || {};
  const qs = rows.map((r, i) => cloudQuestionFromRow(r, Studio.exams.get(r.exam_id), ws, i));
  const mod = { moduleId: topicId, source: 'server', subject: t.subject || rows[0]?.subject, topicTitle: t.title || rows[0]?.topic, chapter: t.chapter || rows[0]?.chapter, examId: t.exam_id || undefined, examYear: t.year ? String(t.year) : undefined, groups: [{ groupId: topicId + '-g01', title: 'G-01', questions: qs }] };
  return WorkspaceManager.stampM(mod, ws);
}
function studioModFromAnalysis(a) {
  return { moduleId: a.moduleId, subject: a.detectedSubject, chapter: a.detectedChapter || 'General', topicTitle: a.topicTitle, examId: a.examId, examYear: a.examYear };
}
async function studioBuildPlan(a, serverRows) {
  const mod = studioModFromAnalysis(a);
  const rows = [], skipped = [];
  a.questions.forEach(q => { const r = srvQuestionRow(q, mod); if (r.problems.length) skipped.push({ no: q.originalQNo, why: r.problems.join(', ') }); else rows.push(r.row); });
  const sMap = new Map(serverRows.map(x => [x.id, x]));
  const unknown = rows.map(r => r.id).filter(i => !sMap.has(i)), elsewhere = new Map();
  for (let i = 0; i < unknown.length; i += 60) {
    const res = await Server.select('questions', `select=id,topic_id&id=in.${srvInList(unknown.slice(i, i + 60))}`);
    (res || []).forEach(x => { if (x.topic_id !== mod.moduleId) elsewhere.set(x.id, x.topic_id); });
  }
  const conflicts = rows.filter(r => elsewhere.has(r.id)).map(r => ({ id: r.id, topic: elsewhere.get(r.id) }));
  const send = rows.filter(r => !elsewhere.has(r.id));
  const fresh = send.filter(r => !sMap.has(r.id));
  const changed = send.filter(r => sMap.has(r.id) && (sMap.get(r.id).content_hash !== r.content_hash || !sMap.get(r.id).is_active));
  const exams = new Map();
  [srvTopicRow(mod).exam_id, ...send.map(r => r.exam_id)].filter(Boolean).forEach(e => { if (!exams.has(e)) exams.set(e, srvExamRow(e, a.questions.find(q => q.metadata?.examId === e)?.metadata?.exam)); });
  return { mod, fresh, changed, same: send.length - fresh.length - changed.length, skipped, conflicts, exams, builtAt: Date.now() };
}
async function studioSend() {
  const a = Studio.imp.analysis, p = Studio.imp.plan; if (!a || !p) return;
  if (Date.now() - p.builtAt > 10 * 60 * 1000) { Studio.imp.plan = null; return studioSetMsg('जाँच पुरानी हो गई — दोबारा "जाँचें" दबाएँ।', 'warn'); }
  const batchId = `STUDIO-${Date.now()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
  const step = t => { Studio.progress = t; studioPaint(); };
  Studio.busy = true; Studio.msg = ''; studioPaint();
  try {
    step('Exams और topic भेज रहे हैं…');
    await Server.upsert('exams', [...p.exams.values()], 'id');
    await Server.upsert('topics', [srvTopicRow(p.mod)], 'id');
    await Server.upsert('import_batches', [{ id: batchId, file_name: String(a.sourceFile || 'file').slice(0, 120), topic_id: p.mod.moduleId, added: p.fresh.length, changed: p.changed.length, unchanged: p.same, removed: 0 }], 'id');
    const total = p.fresh.length + p.changed.length; let done = 0;
    const sendRows = async (rows, extra) => { for (let i = 0; i < rows.length; i += 200) { const chunk = rows.slice(i, i + 200).map(r => ({ ...r, ...extra, import_batch_id: batchId })); await Server.upsert('questions', chunk, 'id'); done += chunk.length; step(`सवाल भेज रहे हैं… ${done} / ${total}`); } };
    await sendRows(p.fresh, { status: 'draft' });
    await sendRows(p.changed, Studio.imp.changedToDraft ? { status: 'draft' } : {});
    const topicId = p.mod.moduleId, n = p.fresh.length, ch = p.changed.length;
    Studio.imp = { file: null, analysis: null, plan: null, changedToDraft: false };
    await studioLoad();
    Studio.review = { topicId, filter: n ? 'draft' : 'all', rows: [], loading: false }; Studio.tab = 'review';
    await studioLoadTopic(topicId);
    Studio.msg = `✅ भेज दिया: ${n} नए${ch ? `, ${ch} बदले` : ''}। ${n ? 'नीचे जाँचकर Publish करें — तब तक students को नहीं दिखेंगे।' : ''}`; Studio.msgKind = 'good';
  } catch (e) { Studio.msg = 'भेजना पूरा नहीं हुआ: ' + e.message + ' — दोबारा "जाँचें" और "भेजें" दबाएँ; जो जा चुका है वह दोहराया नहीं जाएगा।'; Studio.msgKind = 'bad'; Studio.imp.plan = null; }
  finally { Studio.busy = false; Studio.progress = ''; studioPaint(); }
}

/* ---------- review: draft → reviewed → published ---------- */
async function studioLoadTopic(id) {
  Studio.review.topicId = id; Studio.review.loading = true; Studio.review.rows = []; studioPaint();
  try { Studio.review.rows = await studioTopicRows(id, true); }
  catch (e) { Studio.msg = e.message; Studio.msgKind = 'bad'; }
  finally { Studio.review.loading = false; studioPaint(); }
}
function studioReviewRows() {
  const f = Studio.review.filter;
  return Studio.review.rows.filter(r => f === 'all' || (f === 'hidden' ? !r.is_active : r.is_active && r.status === f));
}
function studioReviewHtml() {
  const list = studioTopicStats();
  const rv = Studio.review;
  const pick = `<label class="st-pick"><span>Topic</span><select onchange="studioPickTopic(this.value)"><option value="">— topic चुनें —</option>${list.map(({ t, c }) => `<option value="${escapeHtml(t.id)}" ${t.id === rv.topicId ? 'selected' : ''}>${escapeHtml(t.title)}${c.draft + c.reviewed ? ` (📝${c.draft} 👀${c.reviewed})` : ''}</option>`).join('')}</select></label>`;
  if (!rv.topicId) return `<section class="st-card">${pick}<p class="st-note">Topic चुनें — उसके सवाल यहाँ दिखेंगे।</p></section>`;
  if (rv.loading) return `<section class="st-card">${pick}</section><div class="st-msg">⏳ सवाल ला रहे हैं…</div>`;
  const c = studioCounts(rv.rows);
  const chips = [['draft', `📝 Draft ${c.draft}`], ['reviewed', `👀 Reviewed ${c.reviewed}`], ['published', `✅ Published ${c.published}`], ['all', `सब ${c.total}`]].concat(c.hidden ? [['hidden', `🙈 छिपे ${c.hidden}`]] : []);
  const rows = studioReviewRows();
  const bulk = rows.length && rv.filter !== 'all' && rv.filter !== 'hidden' ? `<div class="st-bulk"><span>दिख रहे ${rows.length} सवाल:</span>
      ${rv.filter === 'draft' ? `<button class="st-btn" onclick="studioBulk('reviewed')">👀 सब Reviewed</button>` : ''}
      ${rv.filter !== 'published' ? `<button class="st-btn primary" onclick="studioBulk('published')">✅ सब Publish</button>` : `<button class="st-btn" onclick="studioBulk('draft')">📝 सब Draft में (छिपाएँ)</button>`}</div>` : '';
  return `<section class="st-card">${pick}<div class="st-chips">${chips.map(([k, l]) => `<button class="${rv.filter === k ? 'on' : ''}" onclick="Studio.review.filter='${k}';studioPaint()">${l}</button>`).join('')}</div>${bulk}</section>
    <div class="st-qs">${rows.slice(0, 200).map(studioQCard).join('') || '<p class="st-note">इस हिस्से में कोई सवाल नहीं।</p>'}${rows.length > 200 ? `<p class="st-note">पहले 200 दिखाए; बाकी के लिए ऊपर के bulk बटन इस्तेमाल करें।</p>` : ''}</div>`;
}
function studioPickTopic(id) { Studio.review = { topicId: id, filter: 'draft', rows: [], loading: false }; if (id) studioLoadTopic(id); else studioPaint(); }
function studioQCard(r) {
  const st = r.is_active ? (r.status || 'published') : 'hidden';
  const opts = Array.isArray(r.options) ? r.options : [];
  const actions = !r.is_active ? '' : st === 'draft'
    ? `<button class="st-btn sm" onclick="studioSetStatus(['${escapeHtml(r.id)}'],'reviewed')">👀 Reviewed</button><button class="st-btn sm primary" onclick="studioSetStatus(['${escapeHtml(r.id)}'],'published')">✅ Publish</button>`
    : st === 'reviewed' ? `<button class="st-btn sm" onclick="studioSetStatus(['${escapeHtml(r.id)}'],'draft')">↩ Draft</button><button class="st-btn sm primary" onclick="studioSetStatus(['${escapeHtml(r.id)}'],'published')">✅ Publish</button>`
    : `<button class="st-btn sm" onclick="studioSetStatus(['${escapeHtml(r.id)}'],'draft')">↩ Draft में (छिपाएँ)</button>`;
  return `<article class="st-q ${st}">
    <div class="st-q-top"><b>Q.${escapeHtml(r.question_no ?? '?')}</b><span class="st-badge ${st}">${st === 'hidden' ? '🙈 छिपा' : STUDIO_STATUS[st].icon + ' ' + STUDIO_STATUS[st].label}</span>${r.source_type === 'PYQ' ? '<span class="st-badge">PYQ</span>' : ''}<small>${escapeHtml([Studio.exams.get(r.exam_id) || r.exam_id, r.year, r.shift].filter(Boolean).join(' · '))}</small></div>
    ${r.question_en ? `<p class="st-q-text">${escapeHtml(r.question_en)}</p>` : ''}${r.question_hi && r.question_hi !== r.question_en ? `<p class="st-q-text hi">${escapeHtml(r.question_hi)}</p>` : ''}
    <ol class="st-opts">${opts.map(o => `<li class="${o.letter === r.answer ? 'ok' : ''}"><b>${escapeHtml(o.letter)}</b><span>${escapeHtml(o.en || '')}${o.hi && o.hi !== o.en ? `<small>${escapeHtml(o.hi)}</small>` : ''}</span>${o.letter === r.answer ? '<em>✓ उत्तर</em>' : ''}</li>`).join('')}</ol>
    ${r.explanation_en || r.explanation_hi ? `<details class="st-det"><summary>व्याख्या</summary><p>${escapeHtml(r.explanation_en || r.explanation_hi)}</p></details>` : ''}
    <div class="st-q-act">${actions}</div></article>`;
}
async function studioSetStatus(ids, status) {
  if (!ids.length) return;
  Studio.busy = true; Studio.progress = 'बदल रहे हैं…'; studioPaint();
  try {
    for (let i = 0; i < ids.length; i += 60) await Server.patch('questions', `id=in.${srvInList(ids.slice(i, i + 60))}`, { status });
    const set = new Set(ids);
    Studio.review.rows.forEach(r => { if (set.has(r.id)) r.status = status; });
    Studio.qIndex.forEach(r => { if (set.has(r.id)) r.status = status; });
    Studio.msg = `${ids.length} सवाल → ${STUDIO_STATUS[status].icon} ${STUDIO_STATUS[status].label}${status === 'published' ? ' (अब students को दिखेंगे)' : status === 'draft' ? ' (students से छिपे)' : ''}`; Studio.msgKind = 'good';
  } catch (e) { Studio.msg = 'नहीं बदला: ' + e.message; Studio.msgKind = 'bad'; }
  finally { Studio.busy = false; Studio.progress = ''; studioPaint(); }
}
function studioBulk(status) {
  const rows = studioReviewRows(); if (!rows.length) return;
  const t = Studio.topics.find(x => x.id === Studio.review.topicId);
  const what = status === 'published' ? 'Publish करें — students को दिखने लगेंगे' : status === 'draft' ? 'Draft में डालें — students से छिप जाएँगे' : 'Reviewed करें';
  if (!confirm(`"${t?.title || ''}" के ${rows.length} सवाल ${what}?`)) return;
  studioSetStatus(rows.map(r => r.id), status);
}

async function saveQuestionDNAChanges(canonicalQId){
  const q=IndexEngine.registry.get(canonicalQId);if(!q)return openCustomToast('Question no longer exists.');
  const get=id=>document.getElementById(id)?.value??'';
  const next={QUESTION_EN:get('dcEditQEn').trim(),QUESTION_HI:get('dcEditQHi').trim(),answer:get('dcEditAnswer').trim().toUpperCase(),EXPLANATION:get('dcEditExplanation').trim()};
  if(!next.QUESTION_EN&&!next.QUESTION_HI)return openCustomToast('At least one question language is required.');
  if(!['A','B','C','D'].includes(next.answer))return openCustomToast('Correct answer must be A, B, C or D.');
  const options=['A','B','C','D'].map(letter=>({letter,en:get('dcOpt'+letter+'En').trim(),hi:get('dcOpt'+letter+'Hi').trim()}));
  if(options.some(o=>!o.en&&!o.hi))return openCustomToast('Every option must contain English or Hindi text.');
  const owners=[];for(const mod of AppModules)for(const group of mod.groups||[])for(const item of group.questions||[])if(item.canonicalQId===canonicalQId)owners.push(item);
  if(owners.length!==1||owners[0]!==q)return openCustomToast('Edit blocked: ownership is missing or ambiguous.');
  const meta={subject:get('dcEditSubject').trim(),chapter:get('dcEditChapter').trim(),topic:get('dcEditTopic').trim(),subtopic:get('dcEditSubtopic').trim()};
  try{
    await DataCore.mutate('Edit '+canonicalQId,mods=>{
      const hit=DataCore.questionsById(mods).get(String(canonicalQId));if(!hit)throw new Error('Question not in this workspace.');
      const c=hit.q;c.QUESTION_EN=next.QUESTION_EN;c.QUESTION_HI=next.QUESTION_HI;c.answer=next.answer;c.EXPLANATION=next.EXPLANATION;c.options=options;
      c.metadata={...(c.metadata||{}),subject:meta.subject||c.metadata?.subject,chapter:meta.chapter||c.metadata?.chapter,topic:meta.topic||c.metadata?.topic,subtopic:meta.subtopic||c.metadata?.subtopic,canonicalQId};
      c.fingerprint=generateContentFingerprint(c.QUESTION_EN,c.QUESTION_HI);
    });
    closeModal();openDataControlModal();openCustomToast('Question saved; index rebuilt.');
  }catch(e){openCustomToast('Save blocked; previous data kept. '+String(e.message||e));}
}

function renderDataControlRows(items) {
  if (!items.length) return `<div class="data-empty">कोई matching question नहीं मिला.</div>`;
  return items.map(q => {
    const m=q.metadata||{};
    return `<div class="dc-row">
      <input class="dc-check" type="checkbox" value="${escapeHtml(q.canonicalQId)}">
      <div class="dc-main">
        <div class="dc-main-title">Q.${escapeHtml(q.originalQNo)} • ${escapeHtml(m.topic||'Question')} • <span class="tax-badge exam">${escapeHtml(m.exam||'—')}</span> ${pyqStatusOf(q)==='PYQ'?'<span class="tax-badge easy">PYQ</span>':pyqStatusOf(q)==='NOT_PYQ'?'<span class="tax-badge theory">PRACTICE</span>':'<span class="tax-badge moderate">NOT MARKED</span>'}</div>
        <div class="dc-main-text">${escapeHtml(q.QUESTION_EN||q.QUESTION_HI||'Question text missing')}</div>${q.QUESTION_EN&&q.QUESTION_HI?`<div class="dc-main-text" style="color:var(--text-muted);margin-top:4px;">${escapeHtml(q.QUESTION_HI)}</div>`:''}<div class="dc-paths"><span class="path-pill">A: ${escapeHtml(q.options?.find(o=>o.letter==='A')?.en||q.options?.find(o=>o.letter==='A')?.hi||'—')}</span><span class="path-pill">B: ${escapeHtml(q.options?.find(o=>o.letter==='B')?.en||q.options?.find(o=>o.letter==='B')?.hi||'—')}</span><span class="path-pill">C: ${escapeHtml(q.options?.find(o=>o.letter==='C')?.en||q.options?.find(o=>o.letter==='C')?.hi||'—')}</span><span class="path-pill">D: ${escapeHtml(q.options?.find(o=>o.letter==='D')?.en||q.options?.find(o=>o.letter==='D')?.hi||'—')}</span><span class="path-pill">Correct: ${escapeHtml(q.answer||'—')}</span></div>
        <div class="dc-paths"><span class="path-pill">${escapeHtml(q.canonicalPath||'—')}</span><span class="path-pill" style="color:var(--primary);">${escapeHtml(q.examPath||'—')}</span></div>
        <div class="dc-actions">
          <button class="btn-action-sm" onclick="viewQuestionDetails('${escapeHtml(q.canonicalQId)}')">👁️ View</button>
          <button class="btn-action-sm" onclick="editQuestionDNA('${escapeHtml(q.canonicalQId)}')">✏️ Edit</button>
          <button class="btn-action-sm" onclick="startSinglePractice('${escapeHtml(q.canonicalQId)}')">🧪 Test</button>
          <button class="btn-action-sm" onclick="viewQuestionMeta('${escapeHtml(q.canonicalQId)}')">🧬 Meta</button>
          <button class="btn-action-sm" style="color:var(--danger); border-color:var(--danger);" onclick="deleteQuestionDNA('${escapeHtml(q.canonicalQId)}')">🗑️ Delete DNA</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function runAndShowDataAudit() { const a=runDataIntegrityAudit(); openCustomToast(a.healthy ? `🟢 Data जाँच पास — ${a.total} सवाल ठीक हैं।` : `⚠️ Data जाँच: ${a.duplicateIds.length} duplicate ID, ${a.missingStem.length} खाली सवाल, ${a.malformedOptions.length} गलत options/उत्तर, ${a.missingPath.length} path नहीं, ${a.orphanCount} बेघर।`); }
function resetAppData() {
  closeDrawer();
  openModal('🗑️ Reset Application', `<div style="font-size:14px; color:var(--text-main); line-height:1.5;">क्या आप वाकई ऐप को डिफ़ॉल्ट स्थिति पर रीसेट करना चाहते हैं? सभी इम्पोर्टेड सवाल और प्रोग्रेस रीसेट हो जाएंगे। (Reset से पहले एक auto-backup रखा जाएगा, जिसे "Backup और Restore" से वापस ला सकते हैं।)</div><div style="display:flex; gap:10px; margin-top:20px;"><button onclick="closeModal()" class="btn-nav">Cancel</button><button onclick="confirmResetAppData()" class="btn-nav danger">Confirm Reset</button></div>`);
}

async function confirmResetAppData() {
  try {
    await StorageWriteQueue.flush();
    try { await DataSafety.snapshot('Reset से पहले'); } catch (_) {}
    await Promise.all([AppStorage.deleteKey(STORAGE_KEY), AppStorage.deleteKey(USER_KEY), AppStorage.deleteKey(IMPORT_HISTORY_KEY), AppStorage.deleteKey(ATTEMPT_HISTORY_KEY), AppStorage.deleteKey(RESULT_HISTORY_KEY), AppStorage.deleteKey(BUILDER_TEMPLATE_KEY), AppStorage.deleteKey(REVIEW_STATE_KEY), AppStorage.deleteKey(STUDY_SETTINGS_KEY)]);
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(USER_KEY);
    localStorage.removeItem(IMPORT_HISTORY_KEY);
    localStorage.removeItem(ATTEMPT_HISTORY_KEY);
    localStorage.removeItem(RESULT_HISTORY_KEY);
    localStorage.removeItem(BUILDER_TEMPLATE_KEY);
    localStorage.removeItem(REVIEW_STATE_KEY);
    localStorage.removeItem(STUDY_SETTINGS_KEY);
    try { sessionStorage.removeItem(BUILDER_DRAFT_KEY); } catch (_) {}
  } finally { location.reload(); }
}

/* Drawer Controls */
function syncDrawerVisibility(){
  document.body.classList.toggle('mtb-admin-tools', adminToolsAllowed());
  const board=WorkspaceManager.current().type==='BOARD';
  const setVisible=(id,visible)=>{const el=document.getElementById(id);if(el)el.hidden=!visible;};
  // Keep tools/data controls available; hide only Competitive-specific global destinations in Board context.
  ['drwExams','drwPYQ','drwTest','drwRevision'].forEach(id=>setVisible(id,!board));
  const sections=document.querySelectorAll('#sideDrawer .drawer-section-title');
  if(sections[0]) sections[0].hidden=false;
}
function closeDrawer() { document.getElementById('sideDrawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); }
document.getElementById('btnMenu').onclick = () => { syncDrawerVisibility(); document.getElementById('sideDrawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); };
document.getElementById('btnCloseDrawer').onclick = closeDrawer; document.getElementById('drawerOverlay').onclick = closeDrawer; document.getElementById('modalOverlay').onclick = closeModal;

// Admin tools (import, cleanup, server upload, Studio) show only for the admin login,
// for this phone if it already holds admin-imported data, or when opened as a local file.
function adminToolsAllowed() {
  if (typeof CloudState !== 'undefined' && CloudState.isAdmin === true) return true;
  if (typeof cloudOnline === 'function' && !cloudOnline()) return true;
  const loggedInStudent = typeof ServerState !== 'undefined' && ServerState.session && typeof CloudState !== 'undefined' && CloudState.isAdmin === false;
  return !loggedInStudent && (ImportHistory || []).length > 0;
}
/* Boot Application — Phase 1A hydration gate */
if (window.MTB_STUDIO) studioBoot(); else initApp();

</script>
